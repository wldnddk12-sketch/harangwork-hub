<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1D4A6E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="하랑허브">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>하랑 업무 허브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: 현장 상황판 — 상단 메뉴 + 카드형 요약 + 엑셀 양식을 살린 표 */
:root{
  --paper:#F3F5F8;--surface:#FFFFFF;--ink:#17222E;--muted:#5C6B7A;--line:#D8DFE7;--soft:#EEF2F6;
  --brand:#1D4A6E;--brand-soft:#E3ECF4;--vis:#F2B705;--vis-soft:#FFF4CC;--vis-ink:#4A3800;
  --up:#C8322A;--down:#2457C5;--ok:#0E7660;--ok-soft:#DDF2EC;--late:#B42318;--late-soft:#FDE7E5;
  --head:#FFF2D2;--head-ink:#3F3000;--hl:#FFF9E8;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F161D;--surface:#17212A;--ink:#E5ECF1;--muted:#97A6B3;--line:#2A3946;--soft:#1C2832;
  --brand:#8DB8E0;--brand-soft:#1E2F3E;--vis:#F2B705;--vis-soft:#3A3010;--vis-ink:#FFE38A;
  --up:#FF8A80;--down:#82AAFF;--ok:#4CC3A5;--ok-soft:#163029;--late:#F2867B;--late-soft:#3A1E1C;
  --head:#3A3218;--head-ink:#FFE9A8;--hl:#2A2618;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F161D;--surface:#17212A;--ink:#E5ECF1;--muted:#97A6B3;--line:#2A3946;--soft:#1C2832;
  --brand:#8DB8E0;--brand-soft:#1E2F3E;--vis:#F2B705;--vis-soft:#3A3010;--vis-ink:#FFE38A;
  --up:#FF8A80;--down:#82AAFF;--ok:#4CC3A5;--ok-soft:#163029;--late:#F2867B;--late-soft:#3A1E1C;
  --head:#3A3218;--head-ink:#FFE9A8;--hl:#2A2618;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:14.5px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1320px;margin:0 auto;padding-inline:18px}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
.bar1{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;flex-wrap:wrap}
.logo{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}
.logo i{display:inline-block;width:9px;height:20px;background:var(--vis);border-radius:2px}
.logo small{font-weight:500;color:var(--muted);font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 6px}
.role{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);flex-wrap:wrap}.role b{color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 11px;cursor:pointer;color:var(--muted);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin;margin-top:6px}
nav.tabs button{background:none;border:0;padding:9px 11px 11px;white-space:nowrap;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;font-size:14px}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--vis);font-weight:600}
nav.tabs .lock{font-size:11px;margin-left:3px}
main{padding-block:22px 60px}
h1.pt{font-size:22px;margin:0;letter-spacing:-.02em}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ph p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 13px;cursor:pointer;font-weight:500;font-size:13.5px}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--surface)}
.btn.vis{background:var(--vis);border-color:var(--vis);color:#3A2C00;font-weight:600}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn.danger{color:var(--late)}
.btn:focus-visible,nav.tabs button:focus-visible,.seg button:focus-visible,.cardlink:focus-visible{outline:3px solid var(--vis);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card h3{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 .go{font-size:12.5px;color:var(--brand);font-weight:500}
.cardlink{cursor:pointer;text-align:left;width:100%;font:inherit}
.cardlink:hover{border-color:var(--brand)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.g4,.g3,.g2{grid-template-columns:1fr}}
.kpi{display:flex;align-items:center;gap:14px}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi span{font-size:12.5px;color:var(--muted)}
.ring{flex:none}
.big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:12.5px}
.up{color:var(--up)}.down{color:var(--down)}.zero{color:var(--muted)}
.pbar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;min-width:60px}
.pbar i{display:block;height:100%;background:var(--brand);border-radius:4px}
.pbar.ok i{background:var(--ok)}.pbar.warn i{background:var(--vis)}.pbar.bad i{background:var(--late)}
.prow{display:grid;grid-template-columns:minmax(70px,auto) 1fr auto;gap:10px;align-items:center;font-size:13px;margin:7px 0}
.prow .v{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.chip{display:inline-block;font-size:11.5px;font-weight:600;border-radius:4px;padding:1px 7px;background:var(--brand-soft);color:var(--brand);white-space:nowrap}
.chip.vis{background:var(--vis-soft);color:var(--vis-ink)}.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.late{background:var(--late-soft);color:var(--late)}
.chip.mute{background:transparent;border:1px solid var(--line);color:var(--muted)}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.subtabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;cursor:pointer;font-size:13.5px}
.subtabs button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--surface);font-weight:600}
.subtabs small{opacity:.75;margin-left:4px}
/* excel-like tables */
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table.x{border-collapse:collapse;width:100%;font-size:13px}
table.x th{background:var(--head);color:var(--head-ink);font-weight:600;padding:7px 8px;border:1px solid var(--line);white-space:nowrap;text-align:center}
table.x td{padding:5px 8px;border:1px solid var(--line);text-align:center;white-space:nowrap}
table.x td.l{text-align:left}
table.x td.num{font-variant-numeric:tabular-nums}
table.x td.cur{background:var(--hl);font-weight:700}
table.x tr.ex td{background:var(--soft);color:var(--muted);text-decoration:line-through}
table.x tr.tot td{background:var(--head);font-weight:700}
table.x input,table.x select{width:100%;min-width:56px;border:1px solid var(--line);border-radius:4px;padding:3px 5px;background:var(--surface);font-size:13px}
table.x input[type=number]{width:64px}
.gname{display:flex;align-items:center;gap:10px;margin:22px 0 8px;flex-wrap:wrap}
.gname b{background:var(--head);color:var(--head-ink);padding:4px 12px;border-radius:4px}
.gname .note{color:var(--late);font-size:12.5px}
.split{display:flex;flex-direction:column;gap:3px;align-items:stretch}
.split span{display:flex;justify-content:space-between;gap:8px;font-size:12px;border-top:1px dashed var(--line);padding-top:2px}
.split span:first-child{border-top:0}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
@media (max-width:1100px){.layout{grid-template-columns:minmax(0,1fr)}}
.side{display:grid;gap:14px;position:sticky;top:120px}
@media (max-width:1100px){.side{position:static}}
.banner{background:var(--vis-soft);color:var(--vis-ink);border-radius:8px;padding:9px 13px;margin-bottom:14px;font-size:13.5px}
.empty{color:var(--muted);font-size:13.5px;padding:18px;border:1px dashed var(--line);border-radius:8px;text-align:center;background:var(--surface)}
/* timetable */
.tt{border-collapse:collapse;font-size:12.5px;min-width:900px;width:100%}
.tt th{background:var(--head);color:var(--head-ink);padding:6px;border:1px solid var(--line);position:sticky;top:0}
.tt td{border:1px solid var(--line);vertical-align:top;padding:3px;height:44px;min-width:96px;cursor:pointer;background:var(--surface)}
.tt td.h{cursor:default;background:var(--soft);font-weight:600;text-align:center;min-width:56px;width:56px}
.tt td:hover:not(.h){background:var(--brand-soft)}
.tt td{height:30px}.tt tr.half td{border-top-style:dashed}.tt tr.half td.h{font-weight:400;color:var(--muted);font-size:12px}
.dh{cursor:grab;color:var(--muted);font-size:16px;padding:0 2px;user-select:none}.dh:active{cursor:grabbing}
.btn.mv{padding:1px 6px;font-size:11px;line-height:1.2}.btn.mv:disabled{opacity:.3}
tr.dragging td{opacity:.45}tr.dropto td{box-shadow:inset 0 3px 0 var(--brand)}
.task{display:block;background:var(--brand-soft);color:var(--brand);border-radius:4px;padding:1px 5px;margin:1px 0;font-size:12px;white-space:normal}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dw{text-align:center;font-size:12.5px;color:var(--muted);font-weight:600;padding:4px}
.cal button.day{min-height:96px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.cal button.day:hover{border-color:var(--brand)}
.cal .dn{font-weight:700;font-size:13px}
.cal .today{border:2px solid var(--vis)}
.cal .other{opacity:.4}
.cal .ev{font-size:11.5px;background:var(--brand-soft);color:var(--brand);border-radius:3px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .more{font-size:11px;color:var(--muted)}
.sun{color:var(--up)}.sat{color:var(--down)}
@media (max-width:620px){.cal button.day{min-height:64px}.cal .ev{display:none}.cal .cnt{display:block}}
.cal .cnt{display:none;font-size:11px;color:var(--brand);font-weight:600}
/* lists */
.post{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:8px}
.post.urgent{border-left:4px solid var(--late)}.post.imp{border-left:4px solid var(--vis)}
.post h4{margin:0;font-size:15.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.post p{margin:0;white-space:pre-line}
.meta{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cond{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.cond h4{margin:0 0 4px;font-size:16px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cond dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:10px 0 0;font-size:13px}
.cond dt{color:var(--muted)}.cond dd{margin:0}
.cond dd.miss{color:var(--muted);font-style:italic}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,18,26,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(36px,env(safe-area-inset-top,0px)) 14px 36px;overflow-y:auto;z-index:30}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:620px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.wide{max-width:860px}
.modal h2{margin:0 0 14px;font-size:18px}
.field{display:flex;flex-direction:column;gap:3px;margin-bottom:10px;min-width:0}
.field>span{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--paper);width:100%}
.field textarea{min-height:80px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:560px){.row2,.row3{grid-template-columns:1fr}}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.actions .sp{flex:1}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.checks label{display:flex;align-items:center;gap:5px;font-size:13.5px}
.field input[type=checkbox],.field input[type=radio]{width:auto;flex:none;padding:0;margin:0}
.attb{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;cursor:pointer;font:inherit;color:inherit;white-space:nowrap}.attb b{color:var(--brand);font-size:15px}.attb small{color:var(--muted)}.attb.none{color:var(--brand);border-style:dashed}
.attbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}.attsum{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.attsum b{font-size:26px;color:var(--brand)}.attsum b small{font-size:14px}
.ahist{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.ah{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:6px;padding:4px 0;font-size:12px}.ah b{font-size:15px}.ah.on{border-color:var(--brand);background:var(--brand-soft)}
.attgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}.attp{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:7px 9px;cursor:pointer}.attp:has(input:checked){background:var(--brand-soft);border-color:var(--brand);font-weight:600}
.jdays{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 14px}.jdays button{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:62px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;color:inherit;font:inherit}
.jdays button b{font-size:15px}.jdays button small{font-size:11px;color:var(--muted)}.jdays button span{font-size:12px;color:var(--brand);font-weight:600}.jdays button span.z{color:var(--muted);font-weight:400}
.jdays button.today{border-color:var(--brand)}.jdays button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}.jdays button[aria-pressed="true"] small,.jdays button[aria-pressed="true"] span{color:#fff}.jdays button.all{justify-content:center;color:var(--brand)}
.jct{display:inline-flex;align-items:center;gap:4px;margin-left:6px}.jct small{color:var(--muted);font-size:11.5px}.jct .ox button{padding:3px 9px}
.pchips{display:flex;gap:6px;flex-wrap:wrap}.pch2{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font:inherit;color:inherit}.apr.grp{background:var(--brand-soft);border-radius:8px;padding:8px 10px!important}.pc.free{background:transparent!important;color:var(--pc)!important;border:1px dashed var(--pc)}.pch2.grp{border-style:dashed}.pch2.grp small{opacity:.75;font-size:11.5px}.pch2.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.adpday{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}.adpday.today{border-color:var(--brand)}.adpday h4{margin:0 0 6px;font-size:14px;display:flex;gap:8px;align-items:baseline}
.adpi{display:flex;align-items:center;gap:6px;padding:5px 0;border-top:1px dashed var(--line);flex-wrap:wrap}.adpi .v{margin-left:auto;font-variant-numeric:tabular-nums}
.paycards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.paycard{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.paycard.gb{border-top:3px solid #E69A2E}.paycard.paid{opacity:.6}
.pch{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:15px;border-bottom:1px dashed var(--line);padding-bottom:8px}.pch .pnm{font-size:16px}.pch .pat{margin-left:auto;font-size:12px;color:var(--muted);font-weight:400}
.pdays{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-variant-numeric:tabular-nums}
.pdays li{display:grid;grid-template-columns:62px 1fr;column-gap:8px;font-size:14px;line-height:1.5}.pdays .pd{font-weight:600}.pdays .pd small{color:var(--muted);font-weight:400}.pdays .pn{grid-column:2;font-size:12.5px;color:var(--late)}.pdays .pn0{color:var(--late)}
.pcf{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px dashed var(--line);padding-top:8px}.pamt input{width:110px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:inherit;margin-right:3px;font:inherit}
.pcb{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.paytot{display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between;margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--brand-soft)}
.paytbl tr.paid td{opacity:.6}.paytbl td{vertical-align:top}.paysheet h3{flex-wrap:wrap;gap:8px}
.warncard{border-color:#F2B705!important;box-shadow:inset 4px 0 0 #F2B705}.latecard{border-color:#E9A3A3!important;box-shadow:inset 4px 0 0 #C62828}.soontxt{color:#9A6A00}
.cttbl tr.ct-soon td{background:#FFF8E1}.cttbl tr.ct-late td{background:#FDECEC}.cttbl tr.ct-renew td{opacity:.6}.ivtbl tr.ivtoday td{background:#EEF4FD}.ivtbl .seg button{white-space:nowrap}
@media (min-width:821px){.ivtbl{font-size:12.5px}.ivtbl th,.ivtbl td{padding:5px 6px}.ivtbl th{white-space:nowrap}
 .ivtbl .gseg button{padding:3px 5px;font-size:11.5px}.ivtbl td:nth-child(8) a{white-space:nowrap}.ivtbl td.nowrap{white-space:nowrap}
 .ivtbl .ivact{white-space:nowrap}.ivtbl .ivact .btn,.ivtbl .ivact .chip{padding:2px 5px;font-size:11.5px;margin:0 1px}
 .ivtbl td:nth-child(9){white-space:normal;max-width:90px}.ivtbl td:nth-child(11),.ivtbl td:nth-child(12){white-space:nowrap}
 .ivtbl td:nth-child(10) .sub{font-size:12px}.ivtbl td:nth-child(10){min-width:120px;white-space:normal}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cttbl tr.ct-soon td{background:#3A3010}:root:not([data-theme="light"]) .cttbl tr.ct-late td{background:#3E1E1E}:root:not([data-theme="light"]) .ivtbl tr.ivtoday td{background:#1E2F4A}}
:root[data-theme="dark"] .cttbl tr.ct-soon td{background:#3A3010}:root[data-theme="dark"] .cttbl tr.ct-late td{background:#3E1E1E}:root[data-theme="dark"] .ivtbl tr.ivtoday td{background:#1E2F4A}

  r.people.forEach(x=>{const n=recOf(x,r);if(!n)return;const o=out[n]=out[n]||{cur:0,base:0};if(!x.out)o.cur++;if(r._att)o.base++;else if((!x.in||x.in<b0)&&(!x.out||x.out>=b0))o.base++;});return out;}
const recExtra=r=>Object.keys(recCounts(r)).filter(n=>!mgrs(r).includes(n));
const mgrCell=r=>esc(r.mgr||"")+recExtra(r).map(n=>`<span class="recm" title="${esc(n)} 채용 인원 포함 (관리담당자별 합계에 따로 셈)">/${esc(n)}</span>`).join("");
/* 일용직은 담당자별 집계에서 '오늘 출근 체크한 인원'으로 셈 (보유 인원 X) */
function attRow(r,d){d=d||attDate();const n=attOf(r,d)||0;const a=((r&&r.att)||{})[d]||{};const ids=Array.isArray(a.ids)?a.ids:[];
  const ppl=ids.length&&hasRoster(r)?r.people.filter(x=>ids.includes(x.id)).map(x=>Object.assign({},x,{out:""})):null;
  let w=null;const ms=mgrs(r);if(ms.length>1&&r.splits){const rb=recCounts(r);w={};ms.forEach(m=>{w[m]=Math.max(0,(+r.splits[m]||0)-((rb[m]||{}).cur||0));});}
  return Object.assign({},r,{cur:n,base:n,splits:null,bsplits:null,people:ppl,recs:null,_att:true,_w:w});}
function attribute(rows,key){ // key: mgr|sales
  const m={};rows.forEach(r=>{
    if(key==="mgr"&&r._att&&r._w){const add=(n,v)=>{if(!v)return;m[n]=m[n]||{cur:0,base:0};m[n].cur+=v;m[n].base+=v;};const rc=recCounts(r);let c=+r.cur||0;
      Object.keys(rc).forEach(n=>{const v=Math.min(rc[n].cur,c);add(n,v);c-=v;});const W=Object.entries(r._w),tot=W.reduce((a,x)=>a+x[1],0);
      if(c>0&&tot>0){const q=W.map(([n,x])=>({n,e:c*x/tot}));q.forEach(o=>o.f=Math.floor(o.e));let left=c-q.reduce((a,o)=>a+o.f,0);q.sort((a,b)=>(b.e-b.f)-(a.e-a.f)).forEach(o=>{if(left>0){o.f++;left--;}add(o.n,o.f);});}
      else add(r.mgr||"미정",c);return;}
    if(key==="mgr"){const rc=recCounts(r);const ks=Object.keys(rc);if(ks.length){let c=+r.cur||0,b=+r.base||0;ks.forEach(n=>{m[n]=m[n]||{cur:0,base:0};const v=rc[n];const vc=Math.min(v.cur,c),vb=Math.min(v.base,b);m[n].cur+=vc;m[n].base+=vb;c-=vc;b-=vb;});
        const sp=r.splits?Object.fromEntries(Object.entries(r.splits).map(([n,v])=>[n,Math.max(0,(+v||0)-((rc[n]&&rc[n].cur)||0))])):null;
        r=Object.assign({},r,{cur:c,base:b,splits:sp,bsplits:null});}const ms=mgrs(r);const sp=r.splits||{};const sum=ms.reduce((s,n)=>s+(+sp[n]||0),0);
      if(ms.length>1&&sum===(+r.cur||0)){ms.forEach(n=>{m[n]=m[n]||{cur:0,base:0};m[n].cur+=+sp[n]||0;});
        const bs=r.bsplits||{};const bsum=ms.reduce((s,n)=>s+(+bs[n]||0),0);const B=+r.base||0;
        if(bs&&bsum===B&&r.bsplits)ms.forEach(n=>m[n].base+=+bs[n]||0);
        else{let left=B;ms.forEach((n,j)=>{const v=j===ms.length-1?left:Math.round(B*(+sp[n]||0)/(sum||1));m[n].base+=v;left-=v;});}
        return;}
      const k=r.mgr||"미정";m[k]=m[k]||{cur:0,base:0};m[k].cur+=+r.cur||0;m[k].base+=+r.base||0;}
    else{const k=r.sales||"(없음)";m[k]=m[k]||{cur:0,base:0};m[k].cur+=+r.cur||0;m[k].base+=+r.base||0;}
  });return m;}

/* ---------- 광고 보고: 업체별 주간 광고표 (M점프 · M지역 · 당근마켓) + 광고비 자동 계산 ---------- */
const PCOL=["#2F6FB2","#C2410C","#0E7660","#7C3AED","#B42318","#A16207","#0F766E","#BE185D","#4D7C0F","#475569"];
const MED=[["j","M점프"],["r","M지역"],["o","114114"],["k","당근마켓"],["u","매체 미구분"]];
const AMT_M=["o","k"];const LS=(x,m)=>(x&&x[m])||[];
const MSHORT={j:"M점프",r:"M지역",o:"114114",k:"당근",u:"미구분"};
const emptyDay=()=>({j:[],r:[],o:[],k:[],u:[]});
const ppl=(x,m)=>AMT_M.includes(m)?LS(x,m).map(e=>e.p):LS(x,m);const nAll=x=>LS(x,"j").length+LS(x,"r").length+LS(x,"o").length+LS(x,"k").length+LS(x,"u").length;
function pName(a){return S.adAlias[a]||a;}
function pColor(a){const n=pName(a);const all=[...new Set([...STAFF,CEO_NAME,...Object.values(S.adAlias)])];const i=all.indexOf(n);return PCOL[(i<0?n.length:i)%PCOL.length];}
const pChip=(a,extra="",cls="")=>`<span class="pc ${cls}" style="--pc:${pColor(a)}" title="${esc(pName(a))}">${esc(a)}${extra}</span>`;
const manwon=n=>n>=10000?(Math.round(n/1000)/10)+"만":num(n);
function lev1(a,b){if(Math.abs(a.length-b.length)>1)return false;let i=0,j=0,e=0;while(i<a.length&&j<b.length){if(a[i]===b[j]){i++;j++;continue;}if(++e>1)return false;if(a.length>b.length)i++;else if(b.length>a.length)j++;else{i++;j++;}}return e+(a.length-i)+(b.length-j)<=1;}
const CO_ALIAS={"에스엘아이앤디":"slind","slind":"slind","알에프에이치아이씨":"rfhic","rfhic":"rfhic","유팩스":"유펙스","피에프네이쳐":"피에프네이처","마그나코스메틱":"마스나코스메틱"};
function coMatch(a,b){const x=CO_ALIAS[norm(a)]||norm(a),y=CO_ALIAS[norm(b)]||norm(b);if(!x||!y)return false;return x===y||x.includes(y)||y.includes(x)||(x.length>=3&&lev1(x,y));}
function toFor(br,co){const rs=(S.to[br]||[]).filter(r=>coMatch(r.co,co));return {n:rs.length,to:rs.reduce((s,r)=>s+(+r.to||0),0),always:rs.some(r=>!r.to)};}
function wkLabel(w){const d=new Date(w);return `${d.getMonth()+1}/${d.getDate()} ~ ${mdShort(iso(addDays(d,6)))}`;}
/* 한 업체·한 주의 광고 건수와 비용.
   M지역: 한 번 올리면 rDays일(기본 3일: 첫날 무료 + 2일 결제) 동안 이어짐 → 그 안의 체크는 한 번만 계산.
   114114: 최초 결제일에 o원(기본 22만원), oDays일(기본 30일) 동안 유지 → 그 안의 체크는 추가 비용 없음.
   지난 주들에 올린 것이 이번 주까지 이어지는 것도 따져서 두 번 계산하지 않음 */
const SPAN_M=["j","r","o"];
function spanDays(m){const P=S.adPrice;return m==="j"?(+P.jDays||2):m==="r"?(+P.rDays||3):(+P.oDays||30);}
function spanPrice(m){const P=S.adPrice;return m==="j"?(+P.j||0):m==="r"?(+P.r||0):(+P.o||0);}
/* 같은 날 같은 사람이 n개 올리면 n개가 동시에 노출됨. 노출 중인 개수보다 많이 적힌 만큼만 새로 결제 */
/* 지사 시트에서만 쓰는 약칭 (예: 천안 시트의 '김' = 김태경). 없으면 전체 약칭 그대로 */
const adWho=(p,b)=>(((S.adAliasBr||{})[b]||{})[p])||p;
const pplB=(x,m,b)=>ppl(x,m).map(p=>adWho(p,b));
/* 114114 무료 광고: 기록은 하되 22만원·30일 계산에는 안 들어감 */
const pplPaid=(x,m,b)=>(m==="o"?LS(x,"o").filter(e=>!e.free).map(e=>e.p):ppl(x,m)).map(p=>adWho(p,b));
const cntBy=arr=>{const o={};arr.forEach(p=>o[p]=(o[p]||0)+1);return o;};
function adCarry(w,b,co){const out={j:{},r:{},o:{}};if(!w||!b)return out;const ev={};
  for(let k=8;k>=1;k--){const pw=iso(addDays(new Date(w),-7*k));const pr=((S.adw[pw]||{})[b]||[]).find(x=>coMatch(x.co,co));if(!pr)continue;
    pr.d.forEach((x,i)=>SPAN_M.forEach(m=>Object.entries(cntBy(pplPaid(x,m,b))).forEach(([p,n])=>{const key=m+"|"+p;(ev[key]=ev[key]||[]).push([i-7*k,n]);})));}
  Object.entries(ev).forEach(([key,L])=>{const [m,p]=key.split("|");let slots=[];L.sort((a,b)=>a[0]-b[0]).forEach(([d,n])=>{slots=slots.filter(e=>e>=d);for(let q=slots.length;q<n;q++)slots.push(d+spanDays(m)-1);});
    slots=slots.filter(e=>e>=0);if(slots.length)out[m][p]=slots;});return out;}
function rowCost(r,w,b){const P=S.adPrice;const carry=adCarry(w,b,r.co);const out={j:0,r:0,o:0,k:0,u:0,cost:{j:0,r:0,o:0,k:0},by:{},missing:0,cover:{}};
  out.ch=[];const add=(p,m,amt,i)=>{const b=out.by[p]=out.by[p]||{j:0,r:0,o:0,k:0,u:0,cost:0};b[m]++;b.cost+=amt;out.ch.push({p,m,amt,i});};
  const slots={};SPAN_M.forEach(m=>Object.entries(carry[m]||{}).forEach(([p,L])=>{slots[m+"|"+p]=[...L];L.forEach(last=>{for(let k=0;k<=Math.min(6,last);k++)out.cover[m+"|"+k+"|"+p]=true;});}));
  r.d.forEach((x,i)=>{
    SPAN_M.forEach(m=>Object.entries(cntBy(pplPaid(x,m,b))).forEach(([p,n])=>{const key=m+"|"+p;const act=(slots[key]||[]).filter(e=>e>=i);
      for(let q=act.length;q<n;q++){const pr=spanPrice(m);out[m]++;out.cost[m]+=pr;add(p,m,pr,i);const end=i+spanDays(m)-1;act.push(end);for(let k=i+1;k<=Math.min(6,end);k++)out.cover[m+"|"+k+"|"+p]=true;}
      slots[key]=act;}));
    LS(x,"o").filter(e=>e.free).forEach(e=>{out.o++;out.oFree=(out.oFree||0)+1;add(adWho(e.p,b),"o",0,i);out.ch[out.ch.length-1].free=true;});

const TT_MGR_ONLY=["서영은"];
const hm=h=>h==null?"":`${pad(Math.floor(h))}:${(h%1)?"30":"00"}`;
const TT_SLOTS=Array.from({length:29},(_,i)=>8+i/2); /* 08:00 ~ 22:00, 30분 단위 */
const hourOpts=sel=>`<option value="">종일</option>${TT_SLOTS.map(h=>`<option value="${h}" ${sel===h?"selected":""}>${hm(h)}</option>`).join("")}`;
const ttVis=e=>(e.staff!==PEOPLE()[0]||me()===PEOPLE()[0])&&(!TT_MGR_ONLY.includes(e.staff)||isBoss());
const TT_PEOPLE=()=>STAFF.filter(n=>n!==PEOPLE()[0]&&(isBoss()||!TT_MGR_ONLY.includes(n)));
const ttEvents=()=>S.events.filter(ttVis);

/* 타임트리: 승인된 연차·반차를 그날 이름 옆에 빨간색으로 */
function lvOn(name,d){const dw=new Date(d).getDay();return ((S.leave&&S.leave.reqs)||[]).find(r=>r.status==="승인"&&r.name===name&&r.from<=d&&(r.to||r.from)>=d&&(r.type!=="연차"||dw%6));}
function lvTag(name,d){const r=lvOn(name,d);return r?` <span class="lvtag">(${r.type})</span>`:"";}
function vTT(){
  const v=S.ui.ttView;
  let html=ph("타임트리","담당자별 시간표(08~22시)와 월간 달력. 칸을 누르면 일정을 넣을 수 있습니다.",`<button class="btn primary" data-act="evNew">+ 일정 추가</button>`)+
   `<div class="subtabs"><button data-act="ttView" data-v="day" aria-pressed="${v==="day"}">담당자별 시간표</button><button data-act="ttView" data-v="cal" aria-pressed="${v==="cal"}">월간 달력</button></div>`;
  if(v==="day"){const d=S.ui.ttDate;const dd=new Date(d);
    html+=`<div class="tools" style="margin-bottom:10px"><button class="btn sm" data-act="ttDay" data-v="-1" aria-label="전날">◀</button><input type="date" data-ui="ttDate" value="${d}" class="btn sm"><button class="btn sm" data-act="ttDay" data-v="1" aria-label="다음날">▶</button><button class="btn sm" data-act="ttDay" data-v="0">오늘</button><b>${dd.getMonth()+1}월 ${dd.getDate()}일 (${DOW[dd.getDay()]})</b></div>`;
    const ev=ttEvents().filter(e=>e.date===d);const allday=ev.filter(e=>e.hour==null);
    if(allday.length)html+=`<div class="banner">종일: ${allday.map(e=>`<button class="task" style="display:inline-block;border:0;cursor:pointer" data-act="evEdit" data-id="${e.id}">${esc(e.staff)} · ${esc(e.title)}</button>`).join(" ")}</div>`;
    html+=`<div class="tw"><table class="tt"><thead><tr><th>시간</th>${TT_PEOPLE().map(p=>`<th>${p}${lvTag(p,d)}${TT_MGR_ONLY.includes(p)?' <small class="sub">🔒</small>':""}</th>`).join("")}</tr></thead><tbody>`;
    for(const h of TT_SLOTS){html+=`<tr class="${h%1?"half":""}"><td class="h">${hm(h)}</td>${TT_PEOPLE().map(p=>{const es=ev.filter(e=>e.hour===h&&e.staff===p);return `<td data-act="evNew" data-h="${h}" data-s="${p}" aria-label="${p} ${hm(h)}">${es.map(e=>`<button class="task" style="border:0;cursor:pointer;width:100%;text-align:left" data-act="evEdit" data-id="${e.id}">${esc(e.title)}</button>`).join("")}</td>`}).join("")}</tr>`;}
    html+=`</tbody></table></div>`;
  }else{const [y,mo]=S.ui.calYm.split("-").map(Number);const first=new Date(y,mo-1,1);const start=addDays(first,-first.getDay());
    html+=`<div class="tools" style="margin-bottom:10px"><button class="btn sm" data-act="calM" data-v="-1" aria-label="이전 달">◀</button><b style="font-size:17px">${y}년 ${mo}월</b><button class="btn sm" data-act="calM" data-v="1" aria-label="다음 달">▶</button><button class="btn sm" data-act="calM" data-v="0">이번 달</button><span class="sub">날짜를 누르면 크게 보입니다</span></div><div class="cal">${DOW.map((d,i)=>`<div class="dw ${i===0?"sun":i===6?"sat":""}">${d}</div>`).join("")}`;
    for(let i=0;i<42;i++){const d=addDays(start,i);const k=iso(d);const es=ttEvents().filter(e=>e.date===k).sort((a,b)=>(a.hour??-1)-(b.hour??-1));const lvs=TT_PEOPLE().map(n=>[n,lvOn(n,k)]).filter(x=>x[1]);
      html+=`<button class="day ${d.getMonth()!==mo-1?"other":""} ${k===iso(TODAY)?"today":""}" data-act="calDay" data-v="${k}" aria-label="${d.getMonth()+1}월 ${d.getDate()}일 일정 ${es.length}건"><span class="dn ${d.getDay()===0?"sun":d.getDay()===6?"sat":""}">${d.getDate()}</span>${lvs.map(([n,r])=>`<span class="ev lvev">${esc(n)} <span class="lvtag">(${r.type})</span></span>`).join("")}${es.slice(0,3).map(e=>`<span class="ev">${e.hour==null?"":hm(e.hour)+" "}${esc(e.staff)} ${esc(e.title)}</span>`).join("")}${es.length>3?`<span class="more">+${es.length-3}건 더</span>`:""}${es.length?`<span class="cnt">${es.length}건</span>`:""}</button>`;}
    html+=`</div>`;
  }
  return html;

   `<h3 style="margin:16px 0 8px;font-size:15px">이 날 일정 추가</h3><div class="row3">${F("시간",`<select name="hour">${hourOpts(null)}</select>`)}${F("담당자",sel("staff",TT_PEOPLE(),ttDef()))}${F("내용",inp("title","","text","required"))}</div>`,
   {wide:true,submit:"추가",onSubmit:fd=>{S.events.push({id:uid(),date:k,hour:fd.get("hour")===""?null:+fd.get("hour"),staff:fd.get("staff"),title:fd.get("title")});toast("추가했습니다");setTimeout(()=>dayModal(k),0);}});

/* ---------- 근로계약 현황 ---------- */
const ctVisBR=()=>limited()?[myBr()]:BRANCHES;
const dDiff=(a,b)=>Math.round((new Date(a)-new Date(b))/864e5);
function ctState(c){if(c.renewedTo)return {k:"renew",lbl:"재작성 완료",cls:"mute",ord:5};if(!c.end)return {k:"open",lbl:"기간 없음",cls:"mute",ord:4};
  const d=dDiff(c.end,iso(TODAY));if(d<0)return {k:"late",lbl:`만료 ${-d}일 지남`,cls:"late",ord:0,d};if(d<=7)return {k:"soon",lbl:d===0?"오늘 만료":`D-${d}`,cls:"soon",ord:1,d};return {k:"ok",lbl:`D-${d}`,cls:"ok",ord:3,d};}
function ctList(){return (S.contracts||[]).filter(c=>ctVisBR().includes(c.branch));}
/* 수정·삭제·재계약: 대표·팀장 전부 / 그 외는 계약 담당·등록한 사람·그 업체 영업담당자·관리담당자만 */
function coStaff(co){const out=new Set();HC_TABS.forEach(t=>(S.hc[t]||[]).forEach(g=>g.rows.forEach(r=>{if(coMatch(r.co,co))[r.sales,r.mgr].forEach(v=>String(v||"").split("/").forEach(n=>{n=n.trim();if(n)out.add(n);}));})));return out;}
const ctCan=c=>isBoss()||(c&&(c.mgr===me()||c.by===me()||coStaff(c.co).has(me())));
function ctRemind(){const L=ctList().filter(c=>{const s=ctState(c);return (s.k==="soon"||s.k==="late")&&c.remind!==c.end&&c.mgr&&ctCan(c);});if(!L.length)return;
  L.forEach(c=>{c.remind=c.end;const s=ctState(c);notify(String(c.mgr||"").split("/").map(x=>x.trim()).filter(Boolean),`근로계약 ${s.k==="late"?"만료됨":"만료 "+s.lbl}: ${c.co} ${c.name} (${mdShort(c.end)}까지) — 다시 작성해 주세요`,"ct",{self:true});});save();}
function vCT(){const f=S.ui.ctF||"soon",q=(S.ui.ctQ||"").trim();const all=ctList();
  const cnt=k=>all.filter(c=>ctState(c).k===k).length;const act=all.filter(c=>!c.renewedTo);
  let L=all.filter(c=>{const k=ctState(c).k;return f==="all"?true:f==="soon"?(k==="soon"||k==="late"):f==="ok"?k==="ok"||k==="open":k==="renew";});
  if(q)L=L.filter(c=>(c.co+" "+c.name+" "+(c.mgr||"")).includes(q));
  L.sort((a,b)=>ctState(a).ord-ctState(b).ord||String(a.end).localeCompare(String(b.end)));
  queueMicrotask(ctRemind);
  return ph("근로계약 현황","근로자별 근로계약 기간을 관리합니다. 만료 7일 전부터 위로 올라오고 담당자에게 알림이 갑니다. 수정·삭제는 그 업체 영업·관리담당자, 계약 담당자, 팀장만 할 수 있습니다.",`<button class="btn" data-act="ctPaste">여러 명 붙여넣기</button><button class="btn primary" data-act="ctNew">+ 계약 등록</button>`)+
  `<div class="grid g4" style="margin-bottom:14px">
   <div class="card"><span class="sub">유효 계약</span><div class="big">${act.length-cnt("late")}명</div></div>
   <div class="card ${cnt("soon")?"warncard":""}"><span class="sub">7일 안에 만료</span><div class="big ${cnt("soon")?"soontxt":""}">${cnt("soon")}명</div></div>
   <div class="card ${cnt("late")?"latecard":""}"><span class="sub">만료됨 · 재작성 필요</span><div class="big ${cnt("late")?"up":""}">${cnt("late")}명</div></div>
   <div class="card"><span class="sub">재작성 완료(지난 계약)</span><div class="big">${cnt("renew")}건</div></div></div>
  <div class="tools" style="justify-content:space-between;margin-bottom:10px"><div class="subtabs" style="margin:0">${[["soon",`만료 임박·만료 ${cnt("soon")+cnt("late")}`],["ok","정상"],["renew","지난 계약"],["all","전체"]].map(([k,l])=>`<button data-act="ctF" data-v="${k}" aria-pressed="${f===k}">${l}</button>`).join("")}</div>
   <input class="btn" style="min-width:180px" placeholder="업체·이름·담당 검색" data-ui="ctQ" value="${esc(q)}" aria-label="검색"></div>
  ${L.length?`<div class="tw"><table class="x resp cttbl"><thead><tr><th>상태</th><th>지사</th><th>업체</th><th>이름</th><th>계약 기간</th><th>담당</th><th>메모</th><th></th></tr></thead><tbody>
  ${L.map(c=>{const s=ctState(c);return `<tr class="ct-${s.k}"><td><span class="chip ${s.cls==="soon"?"vis":s.cls}">${s.lbl}</span></td><td>${c.branch}</td><td class="l">${esc(c.co)}</td><td><b>${esc(c.name)}</b></td><td class="nowrap">${c.start?mdShort(c.start):"?"} ~ <b>${c.end?c.end:"?"}</b></td><td>${esc(c.mgr||"")}</td><td class="l"><span class="sub">${esc(c.memo||"")}</span></td>
   <td class="nowrap">${ctCan(c)?`${!c.renewedTo?`<button class="btn sm ${s.k==="soon"||s.k==="late"?"primary":""}" data-act="ctRenew" data-id="${c.id}">재계약 작성</button> `:""}<button class="btn sm" data-act="ctEdit" data-id="${c.id}">수정</button>`:'<span class="sub" title="담당자·팀장만 수정할 수 있습니다">🔒 보기만</span>'}</td></tr>`}).join("")}</tbody></table></div>`:`<div class="empty">${f==="soon"?"7일 안에 만료되는 계약이 없습니다. 👍":"해당하는 계약이 없습니다."}</div>`}`;}
function ctForm(c,renewOf){const n=!c||!c.id;c=c||{branch:myBr()==="본사"?"본사":myBr(),co:"",name:"",start:iso(TODAY),end:"",mgr:me(),memo:""};
  const cos=[...new Set(HC_TABS.flatMap(t=>(S.hc[t]||[]).flatMap(g=>g.rows.map(r=>r.co))))];
  modal(renewOf?"재계약 작성":n?"근로계약 등록":"근로계약 수정",`${renewOf?`<p class="banner" style="margin-top:0">${esc(renewOf.co)} ${esc(renewOf.name)} — 이전 계약 ${renewOf.start||"?"} ~ ${renewOf.end}. 새 계약 기간을 확인하고 저장하면 이전 계약은 '재작성 완료'로 바뀝니다.</p>`:""}
   <div class="row3">${F("지사",sel("branch",ctVisBR(),c.branch))}${F("업체",`<input name="co" list="ctCos" value="${esc(c.co)}" required><datalist id="ctCos">${cos.map(x=>`<option value="${esc(x)}">`).join("")}</datalist>`)}${F("이름",inp("name",c.name,"text","required"))}</div>
   <div class="row3">${F("계약 시작일",inp("start",c.start,"date","required"))}${F("계약 종료일",inp("end",c.end,"date","required"))}${F("담당",sel("mgr",PEOPLE(),c.mgr||me()))}</div>
   <div class="tools" style="margin:-4px 0 8px"><span class="sub">빠른 기간:</span>${[[1,"1개월"],[3,"3개월"],[6,"6개월"],[12,"1년"]].map(([m,l])=>`<button type="button" class="btn sm" onclick="ctQuick(this,${m})">${l}</button>`).join("")}</div>
   ${F("메모",inp("memo",c.memo||""))}`,
   {submit:renewOf?"재계약 저장":"저장",extra:!n&&!renewOf?`<button type="button" class="btn danger" data-act="ctDel" data-id="${c.id}">삭제</button>`:"",
    onSubmit:fd=>{const o={branch:fd.get("branch"),co:String(fd.get("co")).trim(),name:String(fd.get("name")).trim(),start:fd.get("start"),end:fd.get("end"),mgr:fd.get("mgr"),memo:fd.get("memo")};
     if(o.end&&o.start&&o.end<o.start){toast("종료일이 시작일보다 빠릅니다. 다시 확인해 주세요");setTimeout(()=>ctForm(n?{...o}:{...c,...o},renewOf),0);return;}
     S.contracts=S.contracts||[];if(n){const nc={id:uid(),...o,at:iso(TODAY),by:me()};S.contracts.push(nc);if(renewOf){renewOf.renewedTo=nc.id;renewOf.renewedAt=iso(TODAY);}}else Object.assign(S.contracts.find(x=>x.id===c.id),o);
     toast(renewOf?"재계약을 저장했습니다":"저장했습니다");}});}
function ctQuick(b,m){const f=b.closest("form");const s=f.querySelector('[name=start]').value;if(!s)return;const d=new Date(s);const e=new Date(d.getFullYear(),d.getMonth()+m,d.getDate()-1);f.querySelector('[name=end]').value=iso(e);}
function ctRenew(id){const o=S.contracts.find(x=>x.id===id);if(!o)return;const st=o.end?iso(addDays(new Date(o.end),1)):iso(TODAY);
  const len=o.start&&o.end?Math.max(1,Math.round((new Date(o.end)-new Date(o.start))/864e5/30.4)):3;const sd=new Date(st);
  ctForm({branch:o.branch,co:o.co,name:o.name,start:st,end:iso(new Date(sd.getFullYear(),sd.getMonth()+len,sd.getDate()-1)),mgr:o.mgr||me(),memo:""},o);}
function ctPasteForm(){modal("근로계약 여러 명 붙여넣기",`<p class="sub" style="margin-top:0">한 줄에 한 명: <b>업체 이름 시작일 종료일</b> (예: 삼화 홍길동 2026-10-01 2026-12-31 · 10/1 12/31 처럼 써도 됩니다). 엑셀에서 4칸을 복사해 붙여 넣어도 됩니다.</p>
  <div class="row2">${F("지사",sel("branch",ctVisBR(),myBr()==="본사"?"본사":myBr()))}${F("담당",sel("mgr",PEOPLE(),me()))}</div>${F("내용",'<textarea name="t" rows="8" placeholder="삼화 홍길동 2026-10-01 2026-12-31"></textarea>')}`,
  {wide:true,submit:"등록",onSubmit:fd=>{const y=TODAY.getFullYear();const dt=v=>{let m=v.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})$/);if(m)return iso(new Date(+m[1],+m[2]-1,+m[3]));m=v.match(/^(\d{1,2})[-./](\d{1,2})$/);if(m)return iso(new Date(y,+m[1]-1,+m[2]));return "";};
    const L=String(fd.get("t")||"").split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split(/[\t ]+/);const ds=p.filter(x=>dt(x));const w=p.filter(x=>!dt(x));if(w.length<2||ds.length<2)return null;
      let end=dt(ds[1]);const st=dt(ds[0]);if(end<st&&/^\d{1,2}[-./]\d{1,2}$/.test(ds[1]))end=iso(new Date(new Date(end).getFullYear()+1,new Date(end).getMonth(),new Date(end).getDate()));return {co:w.slice(0,-1).join(" "),name:w[w.length-1],start:st,end};}).filter(Boolean);
    if(!L.length){toast("읽을 수 있는 줄이 없습니다 (업체 이름 시작일 종료일)");return;}S.contracts=S.contracts||[];L.forEach(o=>S.contracts.push({id:uid(),branch:fd.get("branch"),mgr:fd.get("mgr"),memo:"",at:iso(TODAY),by:me(),...o}));toast(`${L.length}명 등록했습니다`);}});}

function ivList(){return (S.interviews||[]).filter(v=>ctVisBR().includes(v.branch));}
/* 지원 DB 담당자 (신입이 생기면 여기에 이름 추가) */

const coKey2=s=>String(s||"").replace(/주식회사|\(주\)|㈜|\s/g,"").toLowerCase();
function coSame(a,b){const x=coKey2(a),y=coKey2(b);if(!x||!y)return false;if(x===y)return true;const ax=CO_ALIAS[norm(a)],ay=CO_ALIAS[norm(b)];if(ax&&ax===ay&&!/\(/.test(a+b))return true;return x.length>=4&&y.length>=4&&lev1(x,y);}
function condList(){const L=[];
  BRANCHES.forEach(b=>{const add=(co,o)=>{let c=L.find(x=>x.branch===b&&coSame(x.co,co));if(c){const k=b+"|"+co;if(k!==c.key&&!c.alts.includes(k))c.alts.push(k);return c;}c={key:b+"|"+co,alts:[],branch:b,co,...o,to:[]};L.push(c);return c;};
    HC_TABS.flatMap(t=>S.hc[t]||[]).filter(g=>g.branch===b).forEach(g=>g.rows.forEach(r=>{if(r.excluded)return;add(r.co,{mgr:r.mgr,sales:r.sales,pay:r.pay,period:r.period,gubun:r.gubun,cur:r.cur});}));
    (S.to[b]||[]).forEach(t=>{let c=L.find(x=>x.branch===b&&coSame(x.co,t.co))||L.find(x=>x.branch===b&&(x.co.replace(/\s/g,"").includes(t.co.replace(/\(.*\)/,"").replace(/\s/g,""))||t.co.replace(/\s/g,"").includes(x.co.replace(/\(.*\)/,"").replace(/\s/g,""))));
      if(c){const k=b+"|"+t.co;if(k!==c.key&&!c.alts.includes(k))c.alts.push(k);}else c=add(t.co,{mgr:t.mgr,sales:"",pay:"",period:"",gubun:"",cur:null});c.to.push(t);});});
  return L;}

function parseArMemo(t){const o={due:"",amt:0,coId:""};const s=String(t||"");
  let m=s.match(/(\d{1,2})\s*[\/.월]\s*(\d{1,2})\s*일?/);
  if(m)o.due=TODAY.getFullYear()+"-"+pad(+m[1])+"-"+pad(+m[2]);
  else if((m=s.match(/(\d{1,2})\s*일/))){let d=new Date(TODAY.getFullYear(),TODAY.getMonth(),+m[1]);if(d<TODAY)d=new Date(TODAY.getFullYear(),TODAY.getMonth()+1,+m[1]);o.due=iso(d);}
  else if(/내일/.test(s))o.due=iso(addDays(TODAY,1));else if(/오늘/.test(s))o.due=iso(TODAY);
  const U={"억":1e8,"천만":1e7,"백만":1e6,"만":1e4,"천":1e3};
  m=s.match(/([\d][\d,.]*)\s*(억|천만|백만|만|천)?\s*원/)||s.match(/([\d][\d,.]*)\s*(억|천만|백만|만)/);
  if(m){o.amt=Math.round(parseFloat(m[1].replace(/,/g,""))*(U[m[2]]||1));}
  const hit=arList().filter(r=>norm(s).includes(norm(r.co))).sort((a,b)=>b.co.length-a.co.length)[0];if(hit)o.coId=hit.id;
  return o;}
const dday=d=>{const n=Math.round((new Date(d)-TODAY)/864e5);return n===0?"오늘":n>0?`D-${n}`:`${-n}일 지남`;};

  put(1,0,`총 ${ps.length}명 · 가불 ${gb.length}명${gb.length?` ${won(sum(gb))}원`:""} · 주급 ${jb.length}명${sum(jb)?` ${won(sum(jb))}원`:""} · ${wait?`지급 대기 ${wait}명`:"모두 지급완료"}`,8);
  put(2,0,`내려받은 시각 ${nowLocal().replace("T"," ").slice(0,16)} · 노란 칸에 금액을 적어 허브 '금액 엑셀 올리기'로 올리면 그대로 들어갑니다`,8);

function parseBoard(text,mode){ // mode join|quit

    const dates=[...l.matchAll(/(\d{1,2})\s*[\/.]\s*(\d{1,2})/g)].map(m=>md(m[0]));
    if(mode==="join"){if(dates[0])date=dates[0];
      const rest=l.replace(/(\d{1,2})\s*[\/.]\s*(\d{1,2})/,"").trim();
      const name=(rest.match(/[가-힣]{2,4}/)||[""])[0];if(!name)return;

  });return out;}
