<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>하랑 업무 허브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F6F8; --surface:#FFFFFF; --ink:#18252F; --muted:#5B6B79; --line:#D9E0E6;
  --brand:#1D4A6E; --brand-soft:#E3ECF4; --vis:#F2B705; --vis-soft:#FFF4CC; --vis-ink:#4A3800;
  --ok:#0E7660; --ok-soft:#DDF2EC; --late:#B42318; --late-soft:#FDE7E5;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F161D; --surface:#17212A; --ink:#E5ECF1; --muted:#97A6B3; --line:#283642;
    --brand:#8DB8E0; --brand-soft:#1E2F3E; --vis:#F2B705; --vis-soft:#3A3010; --vis-ink:#FFE38A;
    --ok:#4CC3A5; --ok-soft:#163029; --late:#F2867B; --late-soft:#3A1E1C;
  }
}
:root[data-theme="dark"]{
  --paper:#0F161D; --surface:#17212A; --ink:#E5ECF1; --muted:#97A6B3; --line:#283642;
  --brand:#8DB8E0; --brand-soft:#1E2F3E; --vis:#F2B705; --vis-soft:#3A3010; --vis-ink:#FFE38A;
  --ok:#4CC3A5; --ok-soft:#163029; --late:#F2867B; --late-soft:#3A1E1C;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px}
.logo{font-weight:700;font-size:18px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo i{display:inline-block;width:10px;height:22px;background:var(--vis);border-radius:2px}
.who{font-size:13px;color:var(--muted)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-top:6px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;padding:10px 12px 12px;white-space:nowrap;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;display:flex;align-items:center;gap:6px}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--vis)}
.count{background:var(--vis);color:#3A2C00;font-size:11px;font-weight:700;border-radius:10px;padding:0 7px;line-height:18px}
main{padding:28px 0 60px}
.banner{background:var(--vis-soft);color:var(--vis-ink);border-radius:8px;padding:10px 14px;margin-bottom:18px;font-size:14px}
h1.hero{font-size:clamp(26px,5vw,40px);line-height:1.25;letter-spacing:-.03em;margin:0 0 6px;font-weight:700}
.mark{background:linear-gradient(transparent 58%,var(--vis) 58%);padding:0 4px}
.sub{color:var(--muted);margin:0 0 26px}
.stats{display:flex;flex-wrap:wrap;gap:28px;padding:16px 0 22px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:28px}
.stat b{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:28px}
h2{font-size:17px;margin:0 0 12px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:10px}
.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sectionhead h1{font-size:24px;margin:0;letter-spacing:-.02em}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;text-align:left;width:100%;display:block}
.item:hover{border-color:var(--brand)}
.item.pending{border-left:4px solid var(--vis)}
.item .t{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .m{font-size:13px;color:var(--muted);margin-top:2px}
.item .x{font-size:14px;margin-top:6px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.chip{font-size:12px;font-weight:600;border-radius:4px;padding:1px 7px;background:var(--brand-soft);color:var(--brand);white-space:nowrap}
.chip.vis{background:var(--vis-soft);color:var(--vis-ink)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.late{background:var(--late-soft);color:var(--late)}
.chip.mute{background:transparent;border:1px solid var(--line);color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:18px;border:1px dashed var(--line);border-radius:8px;text-align:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--surface)}
.btn.vis{background:var(--vis);border-color:var(--vis);color:#3A2C00;font-weight:600}
.btn.danger{color:var(--late)}
.btn:focus-visible,.item:focus-visible,nav.tabs button:focus-visible,.seg button:focus-visible{outline:3px solid var(--vis);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
label.chk{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:13px;background:var(--paper)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--brand-soft)}
tbody tr:last-child td{border-bottom:0}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.board{display:grid;grid-template-columns:repeat(3,minmax(240px,1fr));gap:16px;overflow-x:auto}
.board .col{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;min-height:160px}
.board .col h3{font-size:14px;margin:0 0 10px;color:var(--muted);font-weight:600}
.board .item{background:var(--paper)}
.overlay{position:fixed;inset:0;background:rgba(10,18,26,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(40px,env(safe-area-inset-top,0px)) 14px 40px;overflow-y:auto;z-index:20}
.modal{background:var(--surface);border-radius:10px;width:100%;max-width:560px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h2{font-size:19px;margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field>span{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--paper);width:100%}
.field textarea{min-height:84px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.actions .spacer{flex:1}
.block{margin-bottom:14px}
.block b{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:2px}
.block p{margin:0;white-space:pre-line}
.ceo{background:var(--vis-soft);border-radius:8px;padding:12px 14px;margin-top:6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:28px}
.panel h2{flex-wrap:wrap}
.missrow{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;padding:6px 0}
.missrow>b{font-size:14px;min-width:190px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.md h3{font-size:18px;margin:4px 0 10px}.md h4{font-size:15px;margin:16px 0 6px;color:var(--brand)}
.md p{margin:0 0 8px}.md ul{margin:0 0 8px;padding-left:20px}.md li{margin:2px 0}
.md .tablewrap{margin:4px 0 10px}
table.mdt{min-width:0}table.mdt td,table.mdt th{white-space:normal}table.mdt tbody tr{cursor:auto}table.mdt tbody tr:hover td{background:none}
.modal.wide{max-width:780px}
.digestbox{border:1px solid var(--line);border-radius:8px;padding:14px;max-height:60vh;overflow-y:auto;background:var(--paper)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(70px,120px) 1fr auto;gap:10px;align-items:center;font-size:14px}
.bar .track{height:10px;background:var(--brand-soft);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;background:var(--brand);border-radius:5px}
.bar .v{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;white-space:nowrap}
.grid7 td,.grid7 th{text-align:right}.grid7 td:first-child,.grid7 th:first-child{text-align:left}
.grid7 td.miss{color:var(--late);font-weight:600}.grid7 td.off{color:var(--muted)}
.grid7 td.warn{background:var(--vis-soft)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.kpi b{display:block;font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
.upfile{border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:10px;background:var(--paper)}
.upfile table{min-width:0;font-size:13px}
.drop{border:2px dashed var(--line);border-radius:8px;padding:22px;text-align:center;color:var(--muted);cursor:pointer;display:block}
.drop:hover,.drop.on{border-color:var(--brand);color:var(--brand)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14px;z-index:30}
@media (max-width:600px){.row2{grid-template-columns:1fr}.wrap{padding:0 14px}main{padding-top:20px}}
@media (prefers-reduced-motion:no-preference){.modal{animation:pop .16s ease-out}@keyframes pop{from{transform:translateY(8px);opacity:0}}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="topbar"><div class="logo"><i></i>하랑 업무 허브</div><div class="who" id="who"></div></div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="main"><p class="sub">불러오는 중…</p></main>
<div id="modalRoot"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const S={db:null,user:null,me:null,isOwner:false,canWrite:true,people:[],names:{},
  reports:[],clients:[],tasks:[],notices:[],profiles:[],blocked:false,digests:[],adDays:[],branches:[],af:{period:"month",branch:""},sample:null,abort:null,staffDraw:null,loaded:{},tab:"home",
  rf:{type:"all",pending:false},status:null};
const TABS=[["home","홈"],["ads","광고 보고"],["reports","업무 보고"],["clients","현장·거래처"],["tasks","업무 지시"],["notices","공지·자료"]];

/* ---------- helpers ---------- */
function h(tag,attrs,...kids){const el=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs||{})){if(v==null||v===false)continue;
    if(k==="class")el.className=v;else if(k.startsWith("on"))el.addEventListener(k.slice(2),v);
    else if(k==="value")el.value=v;else el.setAttribute(k,v===true?"":v);}
  for(const c of kids.flat()){if(c==null||c===false)continue;el.append(c.nodeType?c:document.createTextNode(String(c)));}
  return el;}
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const monday=()=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d);};
const addDays=(s,n)=>{const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return ymd(d);};
const weekLabel=s=>{const d=new Date(s+"T00:00:00");return `${d.getMonth()+1}월 ${Math.ceil(d.getDate()/7)}주차`;};
const md=s=>{if(!s)return"";const[,m,d]=s.split("-");return `${+m}/${+d}`;};
const daysUntil=s=>{if(!s)return null;const a=new Date(s+"T00:00:00"),b=new Date(today()+"T00:00:00");return Math.round((a-b)/864e5);};
const nameOf=id=>{if(!id)return"미지정";if(S.names[id])return S.names[id];if(S.me&&id===S.me.id)return S.me.name||"나";return"이름 없음";};
const clientName=id=>{const c=S.clients.find(x=>x.id===id);return c?c.name:"";};
function toast(msg){const t=h("div",{class:"toast",role:"status"},msg);document.body.append(t);setTimeout(()=>t.remove(),2400);}
async function save(fn,ok="저장됨"){
  try{await fn();toast(ok);return true;}
  catch(e){const m=String(e&&(e.message||e)||"");
    if(/row-level security|permission denied/i.test(m))toast("권한이 없습니다. 대표에게 문의하세요.");
    else if(/JWT|session/i.test(m))toast("로그인이 만료되었습니다. 새로고침 후 다시 로그인하세요.");
    else toast("저장하지 못했습니다: "+m.slice(0,80));
    return false;}}

/* ---------- modal ---------- */
function closeModal(){if(S.abort){S.abort.abort();S.abort=null;}S.staffDraw=null;document.getElementById("modalRoot").replaceChildren();}
function openModal(title,body,actions,wide){
  const m=h("div",{class:"modal"+(wide?" wide":""),role:"dialog","aria-modal":"true","aria-label":title},h("h2",{},title),body,h("div",{class:"actions"},actions));
  const o=h("div",{class:"overlay",onclick:e=>{if(e.target===o)closeModal();}},m);
  document.getElementById("modalRoot").replaceChildren(o);
  const f=m.querySelector("input,textarea,select");if(f)f.focus();}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});
const field=(label,input)=>h("label",{class:"field"},h("span",{},label),input);
const sel=(opts,val)=>h("select",{},opts.map(([v,t])=>h("option",{value:v,selected:v===val},t)));
const block=(label,text)=>text?h("div",{class:"block"},h("b",{},label),h("p",{},text)):null;

/* ---------- render ---------- */
let rq=0;function render(){cancelAnimationFrame(rq);rq=requestAnimationFrame(draw);}
function draw(){
  const who=document.getElementById("who"),main0=document.getElementById("main");
  if(!S.me){document.getElementById("tabs").replaceChildren();who.replaceChildren();
    main0.replaceChildren(S.blocked?h("div",{class:"modal",style:"margin:40px auto;max-width:420px"},h("h2",{},"접속 권한이 없습니다"),
      h("p",{class:"sub"},"사용이 중지된 계정이거나 아직 등록되지 않은 계정입니다. 대표에게 문의하세요."),h("div",{class:"actions"},h("button",{class:"btn",onclick:logout},"로그아웃")))
      :(sb?loginView():h("p",{class:"sub"},"불러오는 중…")));return;}
  const pend=S.reports.filter(r=>!r.checked).length;
  document.getElementById("tabs").replaceChildren(...TABS.map(([k,t])=>h("button",{"aria-current":S.tab===k?"page":null,onclick:()=>{S.tab=k;render();window.scrollTo(0,0);}},t,
    k==="reports"&&S.isOwner&&pend?h("span",{class:"count"},pend):null)));
  who.replaceChildren(h("span",{},(S.me.name||"")+(S.isOwner?" (대표)":"")),h("button",{class:"btn",style:"padding:3px 10px;font-size:12px;margin-left:8px",onclick:passwordModal},"비밀번호"),h("button",{class:"btn",style:"padding:3px 10px;font-size:12px;margin-left:4px",onclick:logout},"로그아웃"));
  const main=document.getElementById("main");
  const banners=[];
  if(S.status)banners.push(h("div",{class:"banner"},S.status));
  else if(!S.canWrite)banners.push(h("div",{class:"banner"},"보기 전용 권한입니다. 보고를 작성하려면 대표에게 편집 권한을 요청하세요."));
  const view={home,ads,reports,clients,tasks,notices}[S.tab]();
  main.replaceChildren(...banners,view);
  ensureNames();}

function ensureNames(){}

/* ---------- home ---------- */
function home(){
  const pend=S.reports.filter(r=>!r.checked);
  const open=S.tasks.filter(t=>t.status!=="done");
  const mine=S.me?open.filter(t=>t.assigneeId===S.me.id):[];
  const late=open.filter(t=>{const d=daysUntil(t.due);return d!==null&&d<0;});
  const active=S.clients.filter(c=>c.status==="active");
  const heads=active.reduce((s,c)=>s+(+c.headcount||0),0);
  const expiring=active.filter(c=>{const d=daysUntil(c.end);return d!==null&&d>=0&&d<=30;});
  const todayDaily=S.reports.filter(r=>r.type==="daily"&&r.date===today()).length;
  const hero=S.isOwner
    ? h("h1",{class:"hero"},"확인할 보고 ",h("span",{class:"mark"},pend.length+"건"))
    : h("h1",{class:"hero"},"내 업무 ",h("span",{class:"mark"},mine.length+"건"));
  const sub=h("p",{class:"sub"},new Date().toLocaleDateString("ko-KR",{month:"long",day:"numeric",weekday:"long"})+
    (late.length?`, 마감 지난 지시가 ${late.length}건 있습니다.`:", 마감 지난 지시는 없습니다."));
  const stats=h("div",{class:"stats"},
    h("div",{class:"stat"},h("b",{},active.length+"곳"),h("span",{},"운영 중 현장")),
    h("div",{class:"stat"},h("b",{},heads+"명"),h("span",{},"투입 인원")),
    h("div",{class:"stat"},h("b",{},won(adAgg(adDocs(...monthRange(0))).amt)),h("span",{},"이번 달 광고비")),
    h("div",{class:"stat"},h("b",{},expiring.length+"곳"),h("span",{},"30일 내 계약 만료")));
  const repList=(S.isOwner?pend:S.reports.filter(r=>S.me&&r.author===S.me.id)).slice(0,5);
  const taskList=(S.isOwner?open:mine).slice().sort((a,b)=>(a.due||"9999").localeCompare(b.due||"9999")).slice(0,5);
  const pins=S.notices.filter(n=>n.pinned).concat(S.notices.filter(n=>!n.pinned)).slice(0,4);
  return h("div",{},hero,sub,stats,adTodayPanel(),S.isOwner?missingPanel():null,h("div",{class:"cols"},
    h("section",{},h("h2",{},S.isOwner?"확인 대기 보고":"내가 쓴 보고",S.canWrite?h("button",{class:"btn vis",onclick:()=>reportForm()},"보고 작성"):null),
      repList.length?h("div",{class:"list"},repList.map(reportItem)):h("div",{class:"empty"},S.isOwner?"확인할 보고가 없습니다.":"아직 작성한 보고가 없습니다.")),
    h("section",{},h("h2",{},S.isOwner?"진행 중인 지시":"내게 온 지시"),
      taskList.length?h("div",{class:"list"},taskList.map(taskItem)):h("div",{class:"empty"},"진행 중인 지시가 없습니다.")),
    h("section",{},h("h2",{},"공지"),
      pins.length?h("div",{class:"list"},pins.map(noticeItem)):h("div",{class:"empty"},"등록된 공지가 없습니다."))));}

/* ---------- reports ---------- */
const RT={daily:"일일",weekly:"주간"};
function reportItem(r){
  const cn=clientName(r.clientId);
  return h("button",{class:"item"+(r.checked?"":" pending"),onclick:()=>reportDetail(r)},
    h("div",{class:"t"},h("span",{class:"chip"},RT[r.type]||"보고"),`${nameOf(r.author)} · ${md(r.date)}${r.type==="weekly"?" 주":""}`,
      r.checked?h("span",{class:"chip ok"},"확인됨"):h("span",{class:"chip vis"},"미확인")),
    cn?h("div",{class:"m"},cn):null,
    h("div",{class:"x"},r.done||""));}
function reports(){

  const cells=r=>r.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(c=>c.trim());
  while(i<lines.length){const l=lines[i];
    if(/^\s*\|/.test(l)){const rows=[];while(i<lines.length&&/^\s*\|/.test(lines[i])){rows.push(lines[i]);i++;}
      const body=rows.filter(r=>!/^\s*\|[\s:|-]+\|?\s*$/.test(r));const[head,...rest]=body;
      root.append(h("div",{class:"tablewrap"},h("table",{class:"mdt"},h("thead",{},h("tr",{},cells(head||"").map(c=>h("th",{},inline(c))))),
        h("tbody",{},rest.map(r=>h("tr",{},cells(r).map(c=>h("td",{},inline(c)))))))));ul=null;continue;}
    if(/^#{1,4} /.test(l)){root.append(h(/^# /.test(l)?"h3":"h4",{},inline(l.replace(/^#+ /,""))));ul=null;}
    else if(/^\s*[-*] /.test(l)){if(!ul){ul=h("ul",{});root.append(ul);}const box=/^\s*[-*] \[ \] /.test(l);
      ul.append(h("li",{},box?"☐ ":"",inline(l.replace(/^\s*[-*] (\[[ xX]\] )?/,""))));}
    else if(!l.trim())ul=null;
    else{root.append(h("p",{},inline(l)));ul=null;}
    i++;}

    in:r=>({id:r.id,title:r.title,body:r.body,link:r.link,pinned:r.pinned,author:r.author,createdAt:ms(r.created_at)}),
    out:d=>pick({title:d.title,body:d.body,link:d.link,pinned:d.pinned})},
  adDays:{table:"ad_days",q:t=>t.select("*").gte("date",since()).order("date",{ascending:false}).limit(1000),
    in:r=>({id:`${r.date}_${r.branch_id}`,uid:r.id,date:r.date,branch:r.branch_id,rows:r.items||[],sum:+r.total,excelSum:r.excel_sum==null?null:+r.excel_sum,sheet:r.sheet,fileName:r.file_name,uploader:r.uploader,uploadedAt:ms(r.uploaded_at),createdAt:ms(r.uploaded_at)}),
    out:d=>pick({date:d.date,branch_id:d.branch,items:d.rows,total:d.sum,excel_sum:d.excelSum,sheet:d.sheet,file_name:d.fileName,uploader:S.me.id,uploaded_at:new Date().toISOString()})},
  digests:{table:"digests",q:t=>t.select("*").order("week",{ascending:false}).limit(200),
    in:r=>({id:r.week,week:r.week,text:r.body,createdAt:ms(r.created_at),by:r.created_by})},
  branches:{table:"branches",q:t=>t.select("*").order("sort").order("name"),in:r=>({id:r.id,name:r.name})},
  profiles:{table:"profiles",q:t=>t.select("*"),in:r=>r}
};
const timers={};
function reload(name){clearTimeout(timers[name]);return new Promise(res=>{timers[name]=setTimeout(async()=>{
  const m=MAP[name];const {data,error}=await m.q(sb.from(m.table));
  if(!error){S[name]=(data||[]).map(m.in);if(name==="profiles"){S.names={};S.profiles.forEach(p=>S.names[p.id]=p.name||p.login_id||"");S.people=S.profiles.filter(p=>p.active).map(p=>({id:p.id,name:p.name||p.login_id}));}render();}
  res();},150);});}
async function sbWrite(q,name){const {error}=await q;if(error)throw error;if(name){const p=reload(name);if(name!=="adDays")await p;}}
const db={
  collection:name=>({add:d=>sbWrite(sb.from(MAP[name].table).insert(MAP[name].out(d)),name)}),
  doc:path=>{const [name,id]=path.split("/");const m=MAP[name];
    const where=q=>{if(name==="adDays"){const [date,b]=id.split("_");return q.eq("date",date).eq("branch_id",b);}return q.eq(name==="digests"?"week":"id",id);};
    return{
      update:d=>sbWrite(where(sb.from(m.table).update(m.out(d))),name),
      set:d=>sbWrite(sb.from(m.table).upsert(m.out(d),{onConflict:name==="adDays"?"date,branch_id":"id"}),name),
      delete:()=>sbWrite(where(sb.from(m.table).delete()),name)};}
};

/* ---------- login / account ---------- */
function loginView(){
  const id=h("input",{autocomplete:"username",placeholder:"예: kimtk",id:"loginId"}),pw=h("input",{type:"password",autocomplete:"current-password",id:"loginPw"});
  const msg=h("p",{style:"color:var(--late);font-size:14px;min-height:1.4em;margin:6px 0 0"});
  const btn=h("button",{class:"btn primary",type:"submit",style:"width:100%;margin-top:8px"},"로그인");
  const form=h("form",{class:"modal",style:"margin:40px auto;max-width:380px",onsubmit:async e=>{e.preventDefault();
    const v=id.value.trim();if(!v||!pw.value){msg.textContent="아이디와 비밀번호를 입력하세요.";return;}
    btn.disabled=true;btn.textContent="확인 중…";msg.textContent="";
    const {data,error}=await sb.auth.signInWithPassword({email:v.includes("@")?v:`${v}@${ID_DOMAIN}`,password:pw.value});
    btn.disabled=false;btn.textContent="로그인";
    if(error){msg.textContent=/invalid/i.test(error.message)?"아이디 또는 비밀번호가 맞지 않습니다.":"로그인하지 못했습니다. 잠시 후 다시 시도하세요.";return;}
    await afterLogin(data.user);}},
    h("h2",{},"하랑 업무 허브"),h("p",{class:"sub",style:"margin:0 0 16px"},"회사에서 받은 아이디와 비밀번호로 로그인하세요."),
    field("아이디",id),field("비밀번호",pw),btn,msg,
    h("p",{class:"m",style:"color:var(--muted);font-size:13px;margin:12px 0 0"},"비밀번호를 잊었으면 대표에게 재설정을 요청하세요."));
  return form;}
function passwordModal(){
  const a=h("input",{type:"password",autocomplete:"new-password"}),b=h("input",{type:"password",autocomplete:"new-password"});
  openModal("비밀번호 변경",h("div",{},field("새 비밀번호 (8자 이상)",a),field("새 비밀번호 확인",b)),[h("button",{class:"btn",onclick:closeModal},"취소"),
    h("button",{class:"btn primary",onclick:async()=>{if(a.value.length<8){toast("8자 이상 입력하세요.");return;}if(a.value!==b.value){toast("두 비밀번호가 다릅니다.");return;}
      const {error}=await sb.auth.updateUser({password:a.value});if(error){toast("변경하지 못했습니다: "+error.message);return;}toast("비밀번호를 바꿨습니다.");closeModal();}},"변경")]);}
async function logout(){await sb.auth.signOut();location.reload();}
let poll=null;
async function afterLogin(u){
  const {data:p,error}=await sb.from("profiles").select("*").eq("id",u.id).maybeSingle();
  if(error||!p||!p.active){S.me=null;S.status=null;S.blocked=true;render();return;}
  S.me={id:u.id,name:p.name||p.login_id,loginId:p.login_id};S.isOwner=p.role==="admin";S.canWrite=true;S.db=db;S.blocked=false;
  const names=["profiles","branches","reports","clients","tasks","notices","adDays",...(S.isOwner?["digests"]:[])];
  await Promise.all(names.map(reload));
  clearInterval(poll);poll=setInterval(()=>{if(document.visibilityState==="visible")names.forEach(reload);},60000);
  render();}
(function boot(){
  if(!window.supabase){document.getElementById("main").replaceChildren(h("div",{class:"banner"},"접속 모듈을 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침하세요."));return;}
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  sb.auth.getSession().then(async({data})=>{if(data&&data.session)await afterLogin(data.session.user);else render();});
})();

</script>
