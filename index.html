<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1D4A6E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="하랑허브">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>하랑 업무 허브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: 현장 상황판 — 상단 메뉴 + 카드형 요약 + 엑셀 양식을 살린 표 */
:root{
  --paper:#F3F5F8;--surface:#FFFFFF;--ink:#17222E;--muted:#5C6B7A;--line:#D8DFE7;--soft:#EEF2F6;
  --brand:#1D4A6E;--brand-soft:#E3ECF4;--vis:#F2B705;--vis-soft:#FFF4CC;--vis-ink:#4A3800;
  --up:#C8322A;--down:#2457C5;--ok:#0E7660;--ok-soft:#DDF2EC;--late:#B42318;--late-soft:#FDE7E5;
  --head:#FFF2D2;--head-ink:#3F3000;--hl:#FFF9E8;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F161D;--surface:#17212A;--ink:#E5ECF1;--muted:#97A6B3;--line:#2A3946;--soft:#1C2832;
  --brand:#8DB8E0;--brand-soft:#1E2F3E;--vis:#F2B705;--vis-soft:#3A3010;--vis-ink:#FFE38A;
  --up:#FF8A80;--down:#82AAFF;--ok:#4CC3A5;--ok-soft:#163029;--late:#F2867B;--late-soft:#3A1E1C;
  --head:#3A3218;--head-ink:#FFE9A8;--hl:#2A2618;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F161D;--surface:#17212A;--ink:#E5ECF1;--muted:#97A6B3;--line:#2A3946;--soft:#1C2832;
  --brand:#8DB8E0;--brand-soft:#1E2F3E;--vis:#F2B705;--vis-soft:#3A3010;--vis-ink:#FFE38A;
  --up:#FF8A80;--down:#82AAFF;--ok:#4CC3A5;--ok-soft:#163029;--late:#F2867B;--late-soft:#3A1E1C;
  --head:#3A3218;--head-ink:#FFE9A8;--hl:#2A2618;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:14.5px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1320px;margin:0 auto;padding-inline:18px}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
.bar1{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;flex-wrap:wrap}
.logo{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}
.logo i{display:inline-block;width:9px;height:20px;background:var(--vis);border-radius:2px}
.logo small{font-weight:500;color:var(--muted);font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 6px}
.role{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);flex-wrap:wrap}.role b{color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 11px;cursor:pointer;color:var(--muted);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin;margin-top:6px}
nav.tabs button{background:none;border:0;padding:9px 11px 11px;white-space:nowrap;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;font-size:14px}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--vis);font-weight:600}
nav.tabs .lock{font-size:11px;margin-left:3px}
main{padding-block:22px 60px}
h1.pt{font-size:22px;margin:0;letter-spacing:-.02em}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ph p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 13px;cursor:pointer;font-weight:500;font-size:13.5px}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--surface)}
.btn.vis{background:var(--vis);border-color:var(--vis);color:#3A2C00;font-weight:600}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn.danger{color:var(--late)}
.btn:focus-visible,nav.tabs button:focus-visible,.seg button:focus-visible,.cardlink:focus-visible{outline:3px solid var(--vis);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card h3{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 .go{font-size:12.5px;color:var(--brand);font-weight:500}
.cardlink{cursor:pointer;text-align:left;width:100%;font:inherit}
.cardlink:hover{border-color:var(--brand)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.g4,.g3,.g2{grid-template-columns:1fr}}
.kpi{display:flex;align-items:center;gap:14px}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi span{font-size:12.5px;color:var(--muted)}
.ring{flex:none}
.big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:12.5px}
.up{color:var(--up)}.down{color:var(--down)}.zero{color:var(--muted)}
.pbar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;min-width:60px}
.pbar i{display:block;height:100%;background:var(--brand);border-radius:4px}
.pbar.ok i{background:var(--ok)}.pbar.warn i{background:var(--vis)}.pbar.bad i{background:var(--late)}
.prow{display:grid;grid-template-columns:minmax(70px,auto) 1fr auto;gap:10px;align-items:center;font-size:13px;margin:7px 0}
.prow .v{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.chip{display:inline-block;font-size:11.5px;font-weight:600;border-radius:4px;padding:1px 7px;background:var(--brand-soft);color:var(--brand);white-space:nowrap}
.chip.vis{background:var(--vis-soft);color:var(--vis-ink)}.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.late{background:var(--late-soft);color:var(--late)}
.chip.mute{background:transparent;border:1px solid var(--line);color:var(--muted)}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.subtabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;cursor:pointer;font-size:13.5px}
.subtabs button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--surface);font-weight:600}
.subtabs small{opacity:.75;margin-left:4px}
/* excel-like tables */
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table.x{border-collapse:collapse;width:100%;font-size:13px}
table.x th{background:var(--head);color:var(--head-ink);font-weight:600;padding:7px 8px;border:1px solid var(--line);white-space:nowrap;text-align:center}
table.x td{padding:5px 8px;border:1px solid var(--line);text-align:center;white-space:nowrap}
table.x td.l{text-align:left}
table.x td.num{font-variant-numeric:tabular-nums}
table.x td.cur{background:var(--hl);font-weight:700}
table.x tr.ex td{background:var(--soft);color:var(--muted);text-decoration:line-through}
table.x tr.tot td{background:var(--head);font-weight:700}
table.x input,table.x select{width:100%;min-width:56px;border:1px solid var(--line);border-radius:4px;padding:3px 5px;background:var(--surface);font-size:13px}
table.x input[type=number]{width:64px}
.gname{display:flex;align-items:center;gap:10px;margin:22px 0 8px;flex-wrap:wrap}
.gname b{background:var(--head);color:var(--head-ink);padding:4px 12px;border-radius:4px}
.gname .note{color:var(--late);font-size:12.5px}
.split{display:flex;flex-direction:column;gap:3px;align-items:stretch}
.split span{display:flex;justify-content:space-between;gap:8px;font-size:12px;border-top:1px dashed var(--line);padding-top:2px}
.split span:first-child{border-top:0}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
@media (max-width:1100px){.layout{grid-template-columns:minmax(0,1fr)}}
.side{display:grid;gap:14px;position:sticky;top:120px}
@media (max-width:1100px){.side{position:static}}
.banner{background:var(--vis-soft);color:var(--vis-ink);border-radius:8px;padding:9px 13px;margin-bottom:14px;font-size:13.5px}
.empty{color:var(--muted);font-size:13.5px;padding:18px;border:1px dashed var(--line);border-radius:8px;text-align:center;background:var(--surface)}
/* timetable */
.tt{border-collapse:collapse;font-size:12.5px;min-width:900px;width:100%}
.tt th{background:var(--head);color:var(--head-ink);padding:6px;border:1px solid var(--line);position:sticky;top:0}
.tt td{border:1px solid var(--line);vertical-align:top;padding:3px;height:44px;min-width:96px;cursor:pointer;background:var(--surface)}
.tt td.h{cursor:default;background:var(--soft);font-weight:600;text-align:center;min-width:56px;width:56px}
.tt td:hover:not(.h){background:var(--brand-soft)}
.task{display:block;background:var(--brand-soft);color:var(--brand);border-radius:4px;padding:1px 5px;margin:1px 0;font-size:12px;white-space:normal}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dw{text-align:center;font-size:12.5px;color:var(--muted);font-weight:600;padding:4px}
.cal button.day{min-height:96px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.cal button.day:hover{border-color:var(--brand)}
.cal .dn{font-weight:700;font-size:13px}
.cal .today{border:2px solid var(--vis)}
.cal .other{opacity:.4}
.cal .ev{font-size:11.5px;background:var(--brand-soft);color:var(--brand);border-radius:3px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .more{font-size:11px;color:var(--muted)}
.sun{color:var(--up)}.sat{color:var(--down)}
@media (max-width:620px){.cal button.day{min-height:64px}.cal .ev{display:none}.cal .cnt{display:block}}
.cal .cnt{display:none;font-size:11px;color:var(--brand);font-weight:600}
/* lists */
.post{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:8px}
.post.urgent{border-left:4px solid var(--late)}.post.imp{border-left:4px solid var(--vis)}
.post h4{margin:0;font-size:15.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.post p{margin:0;white-space:pre-line}
.meta{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cond{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.cond h4{margin:0 0 4px;font-size:16px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cond dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:10px 0 0;font-size:13px}
.cond dt{color:var(--muted)}.cond dd{margin:0}
.cond dd.miss{color:var(--muted);font-style:italic}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,18,26,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(36px,env(safe-area-inset-top,0px)) 14px 36px;overflow-y:auto;z-index:30}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:620px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.wide{max-width:860px}
.modal h2{margin:0 0 14px;font-size:18px}
.field{display:flex;flex-direction:column;gap:3px;margin-bottom:10px;min-width:0}
.field>span{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--paper);width:100%}
.field textarea{min-height:80px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:560px){.row2,.row3{grid-template-columns:1fr}}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.actions .sp{flex:1}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.checks label{display:flex;align-items:center;gap:5px;font-size:13.5px}
.field input[type=checkbox],.field input[type=radio]{width:auto;flex:none;padding:0;margin:0}
.picker{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:10px;background:var(--paper)}
.pkq{display:flex;flex-wrap:wrap;gap:6px}.pkq .btn{padding:4px 10px}
.pkg{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:start}.pkg>b{font-size:12.5px;color:var(--muted);padding-top:6px}
.pkl{display:flex;flex-wrap:wrap;gap:6px}
.pk{position:relative;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13.5px;cursor:pointer;white-space:nowrap;user-select:none}
.pk small{color:var(--muted);font-size:11.5px}
.pk input{position:absolute;opacity:0;pointer-events:none}
.pk:has(input:checked){background:var(--brand);border-color:var(--brand);color:var(--surface);font-weight:600}.pk:has(input:checked) small{color:var(--surface);opacity:.8}
.pk:has(input:focus-visible){outline:2px solid #2F6FB2;outline-offset:2px}
@media(max-width:620px){.pkg{grid-template-columns:1fr;gap:4px}.pkg>b{padding:0}}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 15px;border-radius:8px;font-size:13.5px;z-index:40}
.lockview{max-width:420px;margin:40px auto;text-align:center}
.inv-o{color:var(--ok);font-weight:700}.inv-x{color:var(--late);font-weight:700}.inv-w{color:var(--muted);font-weight:700}
.wb{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.wbh{font-weight:700;margin-bottom:4px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.jrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-top:1px dashed var(--line);flex-wrap:wrap}
.jrow:first-of-type{border-top:0}.jn{min-width:0}.jst{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.jst .seg button{padding:4px 9px}
.jday h4{margin:4px 0 8px;font-size:15px;display:flex;gap:8px;align-items:center}.jday{margin-bottom:12px}
.wkh{font-size:16px;margin:0 0 10px}
.pc{display:inline-block;font-size:11px;font-weight:700;line-height:1.5;padding:0 5px;margin:1px;border-radius:4px;color:#fff;background:var(--pc);white-space:nowrap}
table.adt td.adc{cursor:pointer;min-width:74px;vertical-align:top;white-space:normal;padding:4px}
table.adt td.adc:hover{background:var(--brand-soft)}
table.adt .tday{background:var(--hl)}
table.adt th.sat{color:var(--down)}table.adt th.sun{color:var(--up)}
.ivh{display:flex;gap:4px;justify-content:center;font-size:11px;color:var(--muted);margin-top:2px}.ivh .hi{color:var(--ok);font-weight:700}
tr.adwarn td:first-child{box-shadow:inset 4px 0 0 var(--late)}
.dots{display:flex;gap:2px;justify-content:center;margin-bottom:2px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--soft);border:1px solid var(--line)}.dots i.on{background:var(--brand);border-color:var(--brand)}
tr.selw td{background:var(--hl)}
.mtag{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:0 6px;line-height:1.6;white-space:nowrap}
.mtag.mj{background:#DCE7FA;color:#1A458C}.mtag.mr{background:#E6E0FA;color:#4B2EA0}.mtag.mk{background:#FDE6D3;color:#9A420C}.mtag.mo{background:#D5F0E8;color:#0E6650}.mtag.mu{background:var(--soft);color:var(--muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mtag.mj{background:#1E2F4A;color:#9DBDF2}:root:not([data-theme="light"]) .mtag.mr{background:#2C2348;color:#C3B4F5}:root:not([data-theme="light"]) .mtag.mk{background:#3E2615;color:#F4B98A}:root:not([data-theme="light"]) .mtag.mo{background:#123A31;color:#8FDCC5}}
:root[data-theme="dark"] .mtag.mj{background:#1E2F4A;color:#9DBDF2}:root[data-theme="dark"] .mtag.mr{background:#2C2348;color:#C3B4F5}:root[data-theme="dark"] .mtag.mk{background:#3E2615;color:#F4B98A}:root[data-theme="dark"] .mtag.mo{background:#123A31;color:#8FDCC5}
.mbar{display:flex;height:8px;background:var(--soft);border-radius:4px;overflow:hidden;min-width:60px}.mbar i{display:block;height:100%}
.mbar i.mj,.legend i.mj{background:#2F6FB2}.mbar i.mr,.legend i.mr{background:#7B5BD6}.mbar i.mk,.legend i.mk{background:#E07A2E}.mbar i.mo,.legend i.mo{background:#14947A}.mbar i.mu,.legend i.mu{background:#9AA7B4}
.legend{display:flex;gap:10px;font-size:11.5px;color:var(--muted);margin-top:6px;flex-wrap:wrap}.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.pc small{font-weight:600;opacity:.9}.pc.cont{background:transparent;color:var(--pc);border:1px dashed var(--pc)}.pc.nomoney{outline:2px solid var(--late);outline-offset:1px}
.kgrid{display:grid;grid-template-columns:auto 130px;gap:6px 12px;align-items:center}.kgrid label{display:flex;align-items:center;gap:5px;font-size:13.5px}.kgrid input[type=number]{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--paper)}
table.adt tr.coend td{border-bottom:2px solid var(--line)}
.arin{display:grid;grid-template-columns:180px 1fr auto;gap:8px;margin-bottom:6px}.arin select,.arin input{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--paper);min-width:0}
@media (max-width:620px){.arin{grid-template-columns:1fr}}
.armemos{display:grid;gap:4px;margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.armemo{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}.armemo.late .mt{color:var(--late)}
.armdel{display:flex;gap:8px;align-items:flex-start}tr.armdone td{color:var(--muted)}td.nowrap{white-space:nowrap}
/* ---- 핸드폰 화면 ---- */
@media (min-width:621px){.only-m{display:none!important}}
.mlist{display:grid;gap:6px}
.mi{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.mi .mt{min-width:0}.mi .mv{display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right;flex:none;min-width:92px}.mi .mv b{font-size:18px;font-variant-numeric:tabular-nums}
.mi.mx{opacity:.7}.mi.mtot{background:var(--head);border-color:var(--head)}
@media (max-width:620px){
 body{font-size:14px}
 .only-d{display:none!important}
 .wrap{padding-inline:12px}main{padding-block:14px 70px}
 .logo small{display:none}.bar1{padding-top:8px;gap:6px}
 .role{width:100%;flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;scrollbar-width:none;padding-bottom:2px}.role::-webkit-scrollbar{display:none}
 .role .seg{flex:none}.role .seg button{white-space:nowrap;padding:5px 9px}.role .btn{flex:none}
 nav.tabs{scrollbar-width:none}nav.tabs::-webkit-scrollbar{display:none}nav.tabs button{padding:8px 10px 10px;font-size:13.5px}
 h1.pt{font-size:20px}.ph{margin-bottom:12px}.ph p{font-size:12.5px}
 .grid{gap:10px}.g4{grid-template-columns:1fr 1fr}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>/* 하랑 업무 허브 — 기본 설정 (실제 자료는 Supabase 에 저장) */
const BRANCHES=["본사","천안","아산"];
const HC_TABS=["본사","천안","아산","일용직","채용대행"];
const P="전월 1일 ~ 전월 말일";
function R(g,pay,sales,mgr,co,cur,base,extra){return Object.assign({gubun:g,period:P,pay,sales,mgr,co,cur,base},extra||{});}
function T(co,job,sex,mgr,to,age,foreign,note){return {co,job,sex,mgr,to,age,foreign,note:note||"",plan:0,placed:0};}
let ORG=[];const STAFF=[];let CEO_NAME="";const FIN_TEAM=[];
let ME={id:"",name:"",role:"staff",branch:"본사",title:"",team:""};
let PUSH_ON=false;
const VAPID_PUBLIC="BGaLTcJVPOZGor31o6n9BtL4-BfvlRIPlIl6rUK9L7pVR11U97XybM_yIlI9nT4LxWqPhVUOyTQQP-0Qq6C2NsY";
/* 광고 예산이 없는 사람 (경영지원팀 등) */
const NO_AD_BUDGET={"서영은":"경영지원팀","우현경":"경영지원팀","정태균":"예산 없음","정훈":"예산 없음"};
const stable=v=>Array.isArray(v)?"["+v.map(stable).join(",")+"]":(v&&typeof v==="object")?"{"+Object.keys(v).sort().map(k=>JSON.stringify(k)+":"+stable(v[k])).join(",")+"}":JSON.stringify(v??null);

/* ================= 실제 허브: Supabase 저장·불러오기 ================= */
const SB_URL="https://jxwvkloodovpyzmdbkja.supabase.co";
const SB_KEY="sb_publishable_zSKeSjHrtQbg-I_Wu7QUCw_lzC--d6i";
const ID_DOMAIN="harangwork.co.kr";
let sb=null,PROFILES=[],BRMAP={};
const ROLE_LABEL={ceo:"대표",mgr:"팀장",branch:"지사장",staff:"직원"};
const TITLE_RANK={"대표":0,"지사장":1,"팀장":2,"직원":3};
const monthRange=()=>({from:iso(new Date(TODAY.getFullYear(),TODAY.getMonth(),1)),due:iso(new Date(TODAY.getFullYear(),TODAY.getMonth()+1,0))});
function emptyS(){return {role:ME.role,tab:"home",ui:{joinWk:0,quitYm:ym(TODAY),hcBr:"본사",toBr:"본사",hcEdit:false,toEdit:false,ttView:"day",ttDate:iso(TODAY),calYm:ym(TODAY),condBr:"전체",condQ:"",noteF:"all",invYm:ym(TODAY)},
  hc:Object.fromEntries(HC_TABS.map(t=>[t,[]])),baseLabel:"기준",to:Object.fromEntries(BRANCHES.map(b=>[b,[]])),ad:{rows:[]},events:[],conds:{},posts:[],ar:[],
  leave:{alloc:{},reqs:[]},inv:[],goal:{total:0,net:0,fill:0,collect:0,salesG:{meet:0,to:0,deal:0,...monthRange()}},joins:[],quits:[],
  adw:{},adwSample:{},adPrice:{j:146000,r:35200,rDays:2},adAlias:{},adPersonBudget:{},adMembers:{},sales:[],pays:[],docreqs:[],notifs:[]};}
/* 화면 상태(S) → 저장 단위(문서) */
function docsOf(s){const D=new Map();const put=(kind,key,branch,data)=>D.set(kind+"|"+key,{kind,key:String(key),branch:branch||null,data});
  HC_TABS.forEach(t=>(s.hc[t]||[]).forEach((g,i)=>put("hcg",g.name,g.branch,{...g,tab:t,idx:i})));
  put("cfg","baseLabel",null,{v:s.baseLabel});put("cfg","adAlias",null,{v:s.adAlias});put("cfg","adPrice",null,{v:s.adPrice});put("cfg","adPersonBudget",null,{v:s.adPersonBudget});put("cfg","adMembers",null,{v:s.adMembers||{}});
  Object.entries(s.to).forEach(([b,rows])=>put("to",b,b,{rows}));
  Object.entries(s.adw).forEach(([w,bs])=>Object.entries(bs).forEach(([b,rows])=>put("adw",w+"|"+b,b,{week:w,rows})));
  s.ad.rows.forEach(r=>put("adbudget",r.id,r.branch,r));
  s.events.forEach(e=>put("event",e.id,(typeof TT_MGR_ONLY!=="undefined"&&TT_MGR_ONLY.includes(e.staff))?"팀장급":null,e));s.posts.forEach(p=>put("post",p.id,null,p));
  s.ar.forEach(r=>put("ar",r.id,r.branch,r));s.joins.forEach(j=>put("join",j.id,null,j));s.quits.forEach(q=>put("quit",q.id,null,q));
  s.inv.forEach(it=>put("inv",it.id,it.branch,it));Object.entries(s.conds).forEach(([k,v])=>put("cond",k,k.split("|")[0],v));
  Object.entries(s.leave.alloc).forEach(([n,d])=>put("leave_alloc",n,brOf(n),{days:d}));s.leave.reqs.forEach(r=>put("leave_req",r.id,brOf(r.name),r));
  s.sales.forEach(d=>put("sale",d.id,d.branch,d));s.pays.forEach(p=>put("pay",p.id,p.branch,p));s.docreqs.forEach(d=>put("docreq",d.id,d.branch,d));
  const g=s.goal;put("goal","cur",null,{total:g.total,net:g.net,fill:g.fill,salesG:g.salesG});put("goal_money","cur",null,{collect:g.collect});
  return D;}
/* 문서 → 화면 상태 */
function buildS(rows,ui){const s=emptyS();if(ui)s.ui={...s.ui,...ui};const gs=[];
  rows.forEach(({kind,key,data})=>{const d=data||{};switch(kind){
    case "hcg":gs.push(d);break;
    case "cfg":if(key==="baseLabel")s.baseLabel=d.v||"기준";if(key==="adAlias")s.adAlias=d.v||{};if(key==="adPrice")s.adPrice={...s.adPrice,...(d.v||{})};if(key==="adPersonBudget")s.adPersonBudget=d.v||{};if(key==="adMembers")s.adMembers=d.v||{};break;
    case "to":s.to[key]=d.rows||[];break;
    case "adw":{const [w,b]=key.split("|");(s.adw[w]=s.adw[w]||{})[b]=d.rows||[];break;}
    case "adbudget":s.ad.rows.push(d);break;
    case "event":s.events.push(d);break;case "post":s.posts.push(d);break;case "ar":s.ar.push(d);break;
    case "join":s.joins.push(d);break;case "quit":s.quits.push(d);break;case "inv":s.inv.push(d);break;
    case "sale":s.sales.push(d);break;case "pay":s.pays.push(d);break;case "docreq":s.docreqs.push({files:[],...d});break;
    case "cond":s.conds[key]=d;break;case "leave_alloc":s.leave.alloc[key]=+d.days||0;break;case "leave_req":s.leave.reqs.push(d);break;
    case "goal":Object.assign(s.goal,d);if(!s.goal.salesG)s.goal.salesG={meet:0,to:0,deal:0,...monthRange()};break;case "goal_money":Object.assign(s.goal,d);break;}});
  gs.sort((a,b)=>HC_TABS.indexOf(a.tab)-HC_TABS.indexOf(b.tab)||(a.idx||0)-(b.idx||0)).forEach(g=>{const {tab,idx,...rest}=g;(s.hc[tab]=s.hc[tab]||[]).push(rest);});
  s.ad.rows.sort((a,b)=>BRANCHES.indexOf(a.branch)-BRANCHES.indexOf(b.branch)||(a.sort||0)-(b.sort||0));
  s.inv.sort((a,b)=>BRANCHES.indexOf(a.branch)-BRANCHES.indexOf(b.branch)||(a.sort||0)-(b.sort||0));
  if(!Object.keys(s.adw).length){const mon=iso(addDays(TODAY,-((TODAY.getDay()+6)%7)));s.adw[mon]={};}
  s.role=ME.role;return s;}
/* 권한 (서버 RLS 와 같은 규칙 — 서버가 최종 판단) */
const isFin=()=>ME.team==="경영지원팀";
function canRead(kind,branch){const r=ME.role,boss=r==="ceo"||r==="mgr",hq=ME.branch==="본사";
  if(kind==="ar"||kind==="goal_money")return boss;
  if(kind==="event"&&branch==="팀장급")return boss;
  if(kind==="sale")return boss||hq||!branch||branch===ME.branch||branch==="본사";
  if(["hcg","to","adw","adbudget","pay","docreq"].includes(kind))return boss||hq||!branch||branch===ME.branch;return true;}
function canWrite(kind,branch,data){const r=ME.role,boss=r==="ceo"||r==="mgr";
  if(["goal","goal_money","leave_alloc"].includes(kind))return r==="ceo";if(kind==="adbudget")return boss;
  if(kind==="leave_req")return boss||(r==="branch"&&branch===ME.branch)||(data&&data.name===ME.name&&(data.status||"대기")==="대기");
  if(kind==="pay")return canRead(kind,branch)&&((data&&data.status)!=="지급완료"||isFin()||r==="ceo");
  if(kind==="docreq")return canRead(kind,branch)&&((data&&data.status)!=="전달완료"||isFin()||r==="ceo");
  if(kind==="sale")return boss||ME.branch==="본사"||branch===ME.branch;
  return canRead(kind,branch);}
/* 저장: 바뀐 문서만 버전 확인 후 올림 */
let SNAP=new Map(),syncT=null,syncing=false,dirty=false;
const docJson=d=>stable(d.data)+"#"+(d.branch||"");
function save(){try{localStorage.setItem("harang-ui-"+ME.id,JSON.stringify({ui:S.ui,tab:S.tab}));}catch(e){}if(!ME.id)return;dirty=true;clearTimeout(syncT);syncT=setTimeout(sync,350);}
async function sync(){if(syncing){clearTimeout(syncT);syncT=setTimeout(sync,300);return;}syncing=true;dirty=false;setSyncState("저장 중…");
  const now=docsOf(S);let conflict=false,denied=false,n=0;
  try{
    for(const [k,d] of now){const old=SNAP.get(k);const j=docJson(d);if(old&&old.json===j)continue;
      if(!old){const empty=d.data&&Array.isArray(d.data.rows)&&!d.data.rows.length;if(empty&&d.kind!=="adw")continue;}
      if(!canWrite(d.kind,d.branch,d.data)){if(old)old.skip=true;continue;}
      const row={kind:d.kind,key:d.key,branch:d.branch,data:d.data,updated_by:ME.id,updated_at:new Date().toISOString()};
      if(old&&old.version){const {data,error}=await sb.from("hub_data").update({...row,version:old.version+1}).eq("kind",d.kind).eq("key",d.key).eq("version",old.version).select("version");
        if(error){denied=true;continue;}if(!data||!data.length){conflict=true;continue;}SNAP.set(k,{version:data[0].version,json:j,branch:d.branch,data:d.data});n++;}
      else{const {data,error}=await sb.from("hub_data").insert({...row,version:1}).select("version");
        if(error){if(/duplicate|23505/.test((error.message||"")+(error.code||"")))conflict=true;else denied=true;continue;}SNAP.set(k,{version:1,json:j,branch:d.branch,data:d.data});n++;}}
    for(const [k,old] of SNAP){if(now.has(k)||!old.version)continue;const [kind,...rest]=k.split("|");const key=rest.join("|");
      if(!canWrite(kind,old.branch,old.data))continue;
      const {data,error}=await sb.from("hub_data").delete().eq("kind",kind).eq("key",key).eq("version",old.version).select("key");
      if(error){denied=true;continue;}if(!data||!data.length){conflict=true;continue;}SNAP.delete(k);n++;}
  }catch(e){denied=true;}
  syncing=false;
  if(conflict){toast("다른 사람이 먼저 바꾼 내용이 있어 최신 내용으로 불러왔습니다. 방금 바꾼 부분을 다시 확인해 주세요.");await loadAll(true);}
  else if(denied){toast("권한이 없거나 연결이 끊겨 저장하지 못한 내용이 있습니다. 최신 내용으로 다시 불러옵니다.");await loadAll(true);}
  else setSyncState(n?"저장됨":"");}
function setSyncState(t){const e=document.getElementById("syncst");if(e)e.textContent=t;if(t==="저장됨")setTimeout(()=>{if(e&&e.textContent==="저장됨")e.textContent="";},1500);}
async function fetchAll(){const out=[];for(let from=0;;from+=1000){const {data,error}=await sb.from("hub_data").select("kind,key,branch,data,version").order("kind").order("key").range(from,from+999);
  if(error)throw error;out.push(...data);if(data.length<1000)break;}return out;}
let loadT=null;
async function loadAll(force){if(!force&&(dirty||syncing)){clearTimeout(loadT);loadT=setTimeout(()=>loadAll(),1500);return;}
  try{const rows=await fetchAll();const ver=new Map(rows.map(r=>[r.kind+"|"+r.key,r.version]));
    const y=scrollY;const keepModal=document.querySelector(".overlay");const tab=S.tab;const notifs=S.notifs||[];S=buildS(rows,S.ui);if(tab)S.tab=tab;S.notifs=notifs;
    /* 기준점: 불러온 직후의 화면 상태 (기본값으로 채운 칸은 '바뀐 것'으로 보지 않음) */
    SNAP=new Map();for(const [k,d] of docsOf(S))SNAP.set(k,{version:ver.get(k)||null,json:docJson(d),branch:d.branch,data:d.data});
    if(!keepModal){render();scrollTo(0,y);}else renderHead();setSyncState("");}
  catch(e){toast("자료를 불러오지 못했습니다. 인터넷 연결을 확인하세요.");}}
/* ---------- 알림 (hub_notifs) ---------- */
const localStamp=t=>{const d=new Date(t);return iso(d)+"T"+pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());};
async function loadNotifs(){const {data}=await sb.from("hub_notifs").select("*").eq("to_name",ME.name).order("at",{ascending:false}).limit(150);
  S.notifs=(data||[]).map(x=>({id:x.id,to:x.to_name,from:x.from_name,text:x.text,tab:x.tab,at:localStamp(x.at),read:x.read,n:x.n||1}));renderHead();}
/* to: 받을 사람 이름들. 같은 사람에게 같은 내용이 10분 안에 또 가면 한 건으로 묶음(푸시는 처음 한 번만) */
function notify(to,text,tab,opt){const from=me();const grp=opt&&opt.group||null;
  [...new Set(to)].filter(n=>n&&n!==from).forEach(async n=>{try{
    if(grp){const since=new Date(Date.now()-600000).toISOString();
      const {data}=await sb.from("hub_notifs").select("id,n").eq("from_name",from).eq("to_name",n).eq("grp",grp).eq("read",false).gte("at",since).limit(1);
      if(data&&data.length){await sb.from("hub_notifs").update({n:(data[0].n||1)+1,text,at:new Date().toISOString()}).eq("id",data[0].id);return;}}
    await sb.from("hub_notifs").insert({to_name:n,from_name:from,text,tab,grp});}catch(e){}});}
async function markRead(ids){if(!ids.length)return;await sb.from("hub_notifs").update({read:true}).in("id",ids);renderHead();}
/* ---------- 서류 파일 (Storage: hub-files) ---------- */
async function uploadDocFiles(d,files){if(!d||!files.length)return;let ok=0;setSyncState("파일 올리는 중…");
  for(const f of files){if(f.size>20*1024*1024){toast(`${f.name}: 20MB 넘는 파일은 올릴 수 없습니다`);continue;}
    const safe=f.name.replace(/[^\w.\-가-힣]/g,"_");const path=`docreq/${d.id}/${Date.now()}_${safe}`;
    const {error}=await sb.storage.from("hub-files").upload(path,f,{contentType:f.type||"application/octet-stream"});
    if(error){toast(`${f.name}: 올리지 못했습니다 (${error.message})`);continue;}d.files.push({name:f.name,size:f.size,type:f.type,path});ok++;}
  if(ok){notifyCeoChange("서류 파일 첨부","docs");save();const y=scrollY;render();scrollTo(0,y);toast("첨부했습니다 — 다 올렸으면 ‘전달완료’를 누르세요");}else setSyncState("");}
async function openDocFile(id,i){const d=S.docreqs.find(x=>x.id===id);const f=d&&d.files[i];if(!f||!f.path)return;
  const w=window.open("","_blank");const {data,error}=await sb.storage.from("hub-files").createSignedUrl(f.path,300,{download:f.name});
  if(error||!data){if(w)w.close();toast("파일을 열 권한이 없거나 파일이 없습니다.");return;}if(w)w.location=data.signedUrl;else location.href=data.signedUrl;}
/* ---------- 핸드폰 푸시 알림 ---------- */
const b64u=s=>{const p="=".repeat((4-s.length%4)%4);const b=atob((s+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(b,c=>c.charCodeAt(0));};
const isIOS=()=>/iPhone|iPad|iPod/.test(navigator.userAgent);const isStandalone=()=>window.matchMedia("(display-mode: standalone)").matches||navigator.standalone;
async function checkPush(){try{if(!("serviceWorker" in navigator))return;const reg=await navigator.serviceWorker.register("sw.js");
  const sub=reg.pushManager&&await reg.pushManager.getSubscription();PUSH_ON=!!sub&&Notification.permission==="granted";

  if(!("serviceWorker" in navigator)||!("PushManager" in window)||!("Notification" in window)){modal("핸드폰 알림 켜기","<p>이 브라우저는 알림을 지원하지 않습니다. 안드로이드는 크롬, 아이폰은 사파리에서 홈 화면에 추가한 뒤 열어 주세요.</p>");return;}
  try{const reg=await navigator.serviceWorker.register("sw.js");await navigator.serviceWorker.ready;const perm=await Notification.requestPermission();
    if(perm!=="granted"){toast("알림이 꺼져 있습니다. 핸드폰 설정에서 이 앱(사이트)의 알림을 허용해 주세요.");return;}

function ring(p0,size=74,cls){const p=Math.max(0,Math.min(100,p0));const r=size/2-7,c=2*Math.PI*r;
  const col=cls||(p>=100?"var(--ok)":p>=60?"var(--brand)":"var(--vis)");
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${p}%"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--soft)" stroke-width="9"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c*p/100} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/><text x="50%" y="50%" dominant-baseline="central" text-anchor="middle" font-size="${size>80?17:14}" font-weight="700" fill="var(--ink)">${p0}%</text></svg>`;}
function bar(p,cls){const q=Math.max(0,Math.min(100,p));cls=cls??(p>=100?"ok":p>=60?"":p>=30?"warn":"bad");return `<div class="pbar ${cls}"><i style="width:${q}%"></i></div>`;}

function hcTot(b){const rs=hcRows(b);return {cur:rs.reduce((s,r)=>s+(+r.cur||0),0),base:rs.reduce((s,r)=>s+(+r.base||0),0)};}
function hcAll(){return visHC().reduce((a,b)=>{const t=hcTot(b);a.cur+=t.cur;a.base+=t.base;return a;},{cur:0,base:0});}
function mgrs(r){return String(r.mgr||"").split("/").map(s=>s.trim()).filter(Boolean);}
function attribute(rows,key){ // key: mgr|sales
  const m={};rows.forEach(r=>{
    if(key==="mgr"){const ms=mgrs(r);const sp=r.splits||{};const sum=ms.reduce((s,n)=>s+(+sp[n]||0),0);
      if(ms.length>1&&sum===(+r.cur||0)){ms.forEach(n=>{m[n]=m[n]||{cur:0,base:0};m[n].cur+=+sp[n]||0;});
        const bs=r.bsplits||{};const bsum=ms.reduce((s,n)=>s+(+bs[n]||0),0);const B=+r.base||0;
        if(bs&&bsum===B&&r.bsplits)ms.forEach(n=>m[n].base+=+bs[n]||0);
        else{let left=B;ms.forEach((n,j)=>{const v=j===ms.length-1?left:Math.round(B*(+sp[n]||0)/(sum||1));m[n].base+=v;left-=v;});}
        return;}
      const k=r.mgr||"미정";m[k]=m[k]||{cur:0,base:0};m[k].cur+=+r.cur||0;m[k].base+=+r.base||0;}
    else{const k=r.sales||"(없음)";m[k]=m[k]||{cur:0,base:0};m[k].cur+=+r.cur||0;m[k].base+=+r.base||0;}
  });return m;}
function toStat(b){const rs=b?(S.to[b]||[]):Object.values(S.to).flat();const fixed=rs.filter(r=>r.to);
  return {to:fixed.reduce((s,r)=>s+(+r.to||0),0),plan:rs.reduce((s,r)=>s+(+r.plan||0),0),placed:rs.reduce((s,r)=>s+(+r.placed||0),0),always:rs.filter(r=>!r.to).length,n:rs.length};}
function arStat(){const L=arList();const b=L.reduce((s,r)=>s+(+r.billed||0),0),p=L.reduce((s,r)=>s+(+r.paid||0),0);return {b,p,left:b-p};}
function invState(it,m){const s=(it.status||{})[m];const due=m+"-"+pad(it.due);
  if(s&&s.issued)return s.issued<=due?"O":"지연";
  return iso(TODAY)>due||m<ym(TODAY)?"X":"대기";}
function leaveUsed(n){return S.leave.reqs.filter(r=>r.name===n&&r.status==="승인").reduce((s,r)=>s+(+r.days||0),0);}

/* to: 받을 사람 이름들. 나 자신에게는 보내지 않음. 같은 사람·같은 내용이 10분 안에 또 오면 하나로 묶음 */
function notifyProto(to,text,tab,opt){const from=me();const now=nowLocal();S.notifs=S.notifs||[];
  [...new Set(to)].filter(n=>n&&n!==from).forEach(n=>{const g=opt&&opt.group?S.notifs.find(x=>x.to===n&&x.from===from&&x.group===opt.group&&!x.read&&(Date.parse(nowLocal())-Date.parse(x.at))<600000):null;
    if(g){g.at=now;g.n=(g.n||1)+1;g.text=text;return;}S.notifs.unshift({id:uid(),to:n,from,text,tab,at:now,read:false,group:opt&&opt.group,n:1});});

const PCOL=["#2F6FB2","#C2410C","#0E7660","#7C3AED","#B42318","#A16207","#0F766E","#BE185D","#4D7C0F","#475569"];
const MED=[["j","M점프"],["r","M지역"],["o","114114"],["k","당근마켓"],["u","매체 미구분"]];
const AMT_M=["o","k"];const LS=(x,m)=>(x&&x[m])||[];
const MSHORT={j:"M점프",r:"M지역",o:"114114",k:"당근",u:"미구분"};
const emptyDay=()=>({j:[],r:[],o:[],k:[],u:[]});
const ppl=(x,m)=>AMT_M.includes(m)?LS(x,m).map(e=>e.p):LS(x,m);const nAll=x=>LS(x,"j").length+LS(x,"r").length+LS(x,"o").length+LS(x,"k").length+LS(x,"u").length;
function pName(a){return S.adAlias[a]||a;}
function pColor(a){const n=pName(a);const all=[...new Set([...STAFF,CEO_NAME,...Object.values(S.adAlias)])];const i=all.indexOf(n);return PCOL[(i<0?n.length:i)%PCOL.length];}

const manwon=n=>n>=10000?(Math.round(n/1000)/10)+"만":num(n);
function lev1(a,b){if(Math.abs(a.length-b.length)>1)return false;let i=0,j=0,e=0;while(i<a.length&&j<b.length){if(a[i]===b[j]){i++;j++;continue;}if(++e>1)return false;if(a.length>b.length)i++;else if(b.length>a.length)j++;else{i++;j++;}}return e+(a.length-i)+(b.length-j)<=1;}
const CO_ALIAS={"에스엘아이앤디":"slind","slind":"slind","알에프에이치아이씨":"rfhic","rfhic":"rfhic","유팩스":"유펙스","피에프네이쳐":"피에프네이처","마그나코스메틱":"마스나코스메틱"};
function coMatch(a,b){const x=CO_ALIAS[norm(a)]||norm(a),y=CO_ALIAS[norm(b)]||norm(b);if(!x||!y)return false;return x===y||x.includes(y)||y.includes(x)||(x.length>=3&&lev1(x,y));}

/* 한 업체·한 주의 광고 건수와 비용. M지역은 같은 사람이 이어지는 날(기본 2일)까지는 한 번만 계산 */
function rowCost(r){const P=S.adPrice;const out={j:0,r:0,o:0,k:0,u:0,cost:{j:0,r:0,o:0,k:0},by:{},missing:0,cover:{}};
  out.ch=[];const add=(p,m,amt,i)=>{const b=out.by[p]=out.by[p]||{j:0,r:0,o:0,k:0,u:0,cost:0};b[m]++;b.cost+=amt;out.ch.push({p,m,amt,i});};
  r.d.forEach((x,i)=>{LS(x,"j").forEach(p=>{out.j++;out.cost.j+=P.j;add(p,"j",P.j,i);});
    AMT_M.forEach(m=>LS(x,m).forEach(e=>{out[m]++;const a=+e.amt||0;if(!a)out.missing++;out.cost[m]+=a;add(e.p,m,a,i);}));
    LS(x,"u").forEach(p=>{out.u++;add(p,"u",0,i);});});
  const used={};r.d.forEach((x,i)=>LS(x,"r").forEach(p=>{const key=p+"|"+i;if(used[key])return;out.r++;out.cost.r+=P.r;add(p,"r",P.r,i);
    for(let k=1;k<P.rDays;k++){used[p+"|"+(i+k)]=true;out.cover[(i+k)+"|"+p]=true;}}));
  out.total=out.cost.j+out.cost.r+out.cost.o+out.cost.k;out.days=r.d.filter(x=>nAll(x)).length;out.cnt=out.j+out.r+out.o+out.k+out.u;return out;}
function weekCost(w,brs){const t={j:0,r:0,o:0,k:0,u:0,cost:{j:0,r:0,o:0,k:0},total:0,by:{},missing:0,cnt:0};

    Object.entries(c.by).forEach(([p,v])=>{const o=t.by[p]=t.by[p]||{j:0,r:0,o:0,k:0,u:0,cost:0,br:{}};["j","r","o","k","u","cost"].forEach(k=>o[k]+=v[k]);o.br[b]=(o.br[b]||0)+v.cost;});}));return t;}

function parseArMemo(t){const o={due:"",amt:0,coId:""};const s=String(t||"");
  let m=s.match(/(\d{1,2})\s*[\/.월]\s*(\d{1,2})\s*일?/);
  if(m)o.due=TODAY.getFullYear()+"-"+pad(+m[1])+"-"+pad(+m[2]);
  else if((m=s.match(/(\d{1,2})\s*일/))){let d=new Date(TODAY.getFullYear(),TODAY.getMonth(),+m[1]);if(d<TODAY)d=new Date(TODAY.getFullYear(),TODAY.getMonth()+1,+m[1]);o.due=iso(d);}
  else if(/내일/.test(s))o.due=iso(addDays(TODAY,1));else if(/오늘/.test(s))o.due=iso(TODAY);
  const U={"억":1e8,"천만":1e7,"백만":1e6,"만":1e4,"천":1e3};
  m=s.match(/([\d][\d,.]*)\s*(억|천만|백만|만|천)?\s*원/)||s.match(/([\d][\d,.]*)\s*(억|천만|백만|만)/);
  if(m){o.amt=Math.round(parseFloat(m[1].replace(/,/g,""))*(U[m[2]]||1));}
  const hit=arList().filter(r=>norm(s).includes(norm(r.co))).sort((a,b)=>b.co.length-a.co.length)[0];if(hit)o.coId=hit.id;
  return o;}

function arMemoLine(r,m,withCo){const late=m.due&&!m.done&&m.due<iso(TODAY);
  return `<div class="armemo ${late?"late":""}"><span class="sub">${mdShort(m.d)}${m.author?" · "+esc(m.author):""}</span>${withCo?` <b>${esc(r.co)}</b>`:""}

const needInv=it=>/계산서/.test(it.kind||""),needStmt=it=>/명세표/.test(it.kind||"");
function invOX(it,m){const s=(it.status||{})[m]||{};if(s.issued&&!s.inv)return {inv:"O",stmt:s.stmt||""};return {inv:s.inv||"",stmt:s.stmt||""};}
function invSum(m,list){const L=list||S.inv;const r={io:0,ix:0,in:0,so:0,sx:0,sn:0};L.forEach(it=>{const s=invOX(it,m);
  if(needInv(it)){r.in++;if(s.inv==="O")r.io++;if(s.inv==="X")r.ix++;}if(needStmt(it)){r.sn++;if(s.stmt==="O")r.so++;if(s.stmt==="X")r.sx++;}});return r;}

/* ---------- 주급·가불 신청 ---------- */

const canPay=()=>S.role==="ceo"||FIN_TEAM.includes(me());
const payVisBR=()=>limited()?[myBr()]:BRANCHES;
function workHours(a,b){const t=s=>{const [h,m]=s.split(":").map(Number);return h*60+(m||0);};let d=t(b)-t(a);if(d<=0)d+=1440;return d/60;}
/* 카톡 형식 그대로 읽기: 빈 줄로 묶음을 나누고, 묶음 안에서 날짜가 없는 줄 = "업체 이름" */
function parsePay(text){const blocks=String(text||"").split(/\n\s*\n/);const out=[];let typeHint="";
  blocks.forEach(bk=>{const lines=bk.split("\n").map(l=>l.trim()).filter(Boolean);let cur=null;const pend=[];
    lines.forEach(l=>{if(/신청|입니다|부탁/.test(l)&&!/\d{1,2}\s*\/\s*\d{1,2}/.test(l)){if(/가불/.test(l))typeHint="가불";else if(/주급/.test(l))typeHint="주급";return;}
      const dm=l.match(/^(\d{1,2})\s*[\/.]\s*(\d{1,2})\s*(.*)$/);
      if(dm){const rest=dm[3].trim();const tm=rest.match(/(\d{1,2}:\d{2})\s*[~\-–]\s*(\d{1,2}:\d{2})\s*(.*)$/);
        const day={date:md(dm[1]+"/"+dm[2]),start:tm?tm[1]:"",end:tm?tm[2]:"",note:tm?tm[3].trim():rest};day.h=tm?Math.round(workHours(tm[1],tm[2])*10)/10:0;
        (cur?cur.days:pend).push(day);return;}
      const amt=l.match(/([\d][\d,.]*)\s*(만)?\s*원/);if(amt&&cur){cur.amt=Math.round(parseFloat(amt[1].replace(/,/g,""))*(amt[2]?1e4:1));return;}
      let co="",name="";const sp=l.lastIndexOf(" ");if(sp>0){co=l.slice(0,sp).trim();name=l.slice(sp+1).trim();}else{const mm=l.match(/^(.*?)([가-힣]{3})$/);if(mm){co=mm[1];name=mm[2];}else{name=l;}}
      cur={co,name,days:pend.splice(0),amt:0};out.push(cur);});
    if(pend.length&&out.length)out[out.length-1].days.push(...pend);});
  out.forEach(o=>{if(/^[a-z0-9 .&-]+$/i.test(o.co))o.co=o.co.toUpperCase();if(!o.type)o.type=typeHint||"주급";o.hours=Math.round(o.days.reduce((s,d)=>s+(d.h||0),0)*10)/10;o.workDays=o.days.filter(d=>d.h>0).length;});return out;}
function payLine(p){const paid=p.status==="지급완료";
  return `<div class="jrow payrow ${paid?"paid":""}"><div class="jn"><b>${esc(p.co)}</b> ${esc(p.name)} <span class="chip ${p.type==="가불"?"vis":""}">${p.type}</span>${p.type==="주급"&&canPay()&&!paid?` <label class="payamt">주급 금액 <input type="number" data-payamt="${p.id}" value="${p.amt||""}" placeholder="경영지원팀 입력" step="1000" min="0" aria-label="${esc(p.name)} 주급 금액">원</label>`:p.amt?` <b>${won(p.amt)}원</b>`:p.type==="주급"?' <span class="sub">금액은 경영지원팀이 입력</span>':""}
   <div class="sub">${p.days.map(d=>`${mdShort(d.date)} ${d.start?d.start+"~"+d.end:""}${d.note?" "+esc(d.note):""}`).join(" · ")}</div>
   <div class="sub">근무 ${p.workDays}일 · ${p.hours}시간 (휴게 포함)${paid?` · <span style="color:var(--ok)">${esc(p.paidBy)} ${mdShort(p.paidAt)} 지급완료</span>`:""}</div></div>
   <div class="jst">${paid?`<span class="chip ok">지급완료</span>${canPay()?`<button class="btn sm" data-act="payUndo" data-id="${p.id}">되돌리기</button>`:""}`:`<span class="chip mute">지급 대기</span>${canPay()?`<button class="btn sm primary" data-act="payDone" data-id="${p.id}">지급완료</button>`:""}`}
   ${!paid&&(p.by===me()||canPay())?`<button class="btn sm" data-act="payEdit" data-id="${p.id}" aria-label="수정">✎</button>`:""}</div></div>`;}
function vPay(){const f=S.ui.payF||"wait";const brs=payVisBR();const L=S.pays.filter(p=>brs.includes(p.branch));
  const wait=L.filter(p=>p.status!=="지급완료"),mon=ym(TODAY);const doneM=L.filter(p=>p.status==="지급완료"&&(p.paidAt||"").startsWith(mon));

  return ph("주급·가불 신청",`카톡에 올리던 그대로 붙여 넣으면 업체·이름·근무일로 정리됩니다. 경영지원팀(${FIN_TEAM.join("·")})이 지급하면 '지급완료'를 누릅니다.`,`<button class="btn primary" data-act="payNew">+ 주급·가불 신청</button>`)+
  (canPay()?`<div class="banner">${S.role==="ceo"?"대표":"경영지원팀"} 화면 — 지급이 끝난 사람은 '지급완료'를 눌러 주세요. 신청한 직원에게 완료로 보입니다.</div>`:"")+
  `<div class="grid g3" style="margin-bottom:14px"><div class="card"><span class="sub">지급 대기</span><div class="big ${wait.length?"up":""}">${wait.length}명</div><span class="sub">주급 ${wait.filter(p=>p.type==="주급").length} · 가불 ${wait.filter(p=>p.type==="가불").length}</span></div>
   <div class="card"><span class="sub">${TODAY.getMonth()+1}월 지급완료</span><div class="big" style="color:var(--ok)">${doneM.length}명</div>${doneM.some(p=>p.amt)?`<span class="sub">${won(doneM.reduce((s,p)=>s+(+p.amt||0),0))}원</span>`:""}</div>
   <div class="card"><span class="sub">업체별 대기</span>${Object.entries(wait.reduce((a,p)=>(a[p.co]=(a[p.co]||0)+1,a),{})).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([c,n])=>`<div class="prow"><span>${esc(c)}</span>${bar(pct(n,wait.length)," ")}<span class="v">${n}명</span></div>`).join("")||'<span class="sub">없음</span>'}</div></div>
  <div class="subtabs">${[["wait","지급 대기"],["done","지급완료"],["all","전체"]].map(([k,l])=>`<button data-act="payF" data-v="${k}" aria-pressed="${f===k}">${l}</button>`).join("")}</div>
  <div class="grid">${bl.map(ps=>{const p0=ps[0];const nw=ps.filter(p=>p.status!=="지급완료").length;
    return `<div class="card"><h3><span>${esc(p0.by)} <span class="sub">${mdShort(p0.at.slice(0,10))} ${p0.at.slice(11,16)} · ${p0.branch} · ${ps.length}명</span></span>${canPay()&&nw>1?`<button class="btn sm primary" data-act="payBatch" data-v="${p0.batch}">${nw}명 모두 지급완료</button>`:""}</h3>${ps.map(payLine).join("")}</div>`;}).join("")||'<div class="empty">해당하는 신청이 없습니다.</div>'}</div>`;}
function payNewForm(){modal("주급·가불 신청",`<div class="row2">${F("구분",sel("type",["주급","가불"],"주급"))}${F("지사",sel("branch",payVisBR(),myBr()))}</div>

  <p class="sub">사람마다 빈 줄로 띄워 주세요. ‘업체 이름’ 줄은 날짜 위에 써도 되고 아래에 써도 됩니다. 가불은 금액(예: 30만원)을 같이 적어 주세요. 주급 금액은 경영지원팀이 넣습니다.</p><div id="payPv" class="sub"></div>`,

  `<div class="tw"><table class="x resp"><thead><tr><th>항목</th><th>이번 달 목표</th><th>현재 실적</th><th>달성률</th></tr></thead><tbody>
  ${row("total","총 투입 인원","명",all.cur,"인원현황 합계에서 자동")}${row("net","신규 투입(순증)","명",all.cur-all.base,`${esc(S.baseLabel)} 대비 증감`)}${row("fill","TO 충원율","%",pct(ts.placed,ts.to),"TO 현황의 실제 투입 ÷ TO")}
  ${row("collect","미수금 회수","원",ar.p,"미수금 현황의 회수액 합계")}</tbody></table></div>
  <div class="card" style="margin-top:14px"><h3>영업 목표 <span class="sub">영업은 시간이 걸리니 기한을 따로 정합니다 · 결과는 '영업성과' 메뉴와 홈에 나옵니다</span></h3>

   <div class="tw" style="border:0"><table class="x resp"><thead><tr><th>항목</th><th>목표</th><th>현재 실적</th><th>달성률</th></tr></thead><tbody>
   ${(()=>{const st=salesStat(S.sales);const sg=SG();const r=(k,l,cur,u)=>`<tr><td class="l"><b>${l}</b></td><td><input type="number" data-set="goal.salesG.${k}" data-type="num" value="${sg[k]}" style="width:110px" aria-label="${l} 목표"> ${u}</td><td class="num cur">${num(cur)} ${u}</td><td style="min-width:160px">${bar(sg[k]?pct(cur,sg[k]):0)}<span class="sub">${sg[k]?pct(cur,sg[k]):0}%</span></td></tr>`;

/* ---------- 영업성과 ---------- */
const DEAL_TYPES=["도급","채용대행","일용직"];
const salesVisBR=()=>limited()?[...new Set([myBr(),"본사"])]:BRANCHES;
const salesList=()=>S.sales.filter(d=>salesVisBR().includes(d.branch));
const SG=()=>S.goal.salesG||(S.goal.salesG={meet:0,to:0,deal:0,from:iso(new Date(TODAY.getFullYear(),TODAY.getMonth(),1)),due:iso(new Date(TODAY.getFullYear(),TODAY.getMonth()+1,0))});
const inGoal=d=>{const g=SG();return d>=g.from&&d<=g.due;};
function salesStat(list){const g=SG();const L=list||salesList();
  const meetDone=L.filter(d=>d.status!=="예정"&&inGoal(d.meetDate));const meetAll=L.filter(d=>inGoal(d.meetDate));
  const deals=L.filter(d=>DEAL_TYPES.includes(d.result)&&inGoal(d.resultDate||d.meetDate));
  return {meet:meetDone.length,meetPlan:meetAll.length-meetDone.length,to:meetDone.reduce((s,d)=>s+(+d.to||0),0),deal:deals.length,dealTo:deals.reduce((s,d)=>s+(+d.to||0),0),
    byType:Object.fromEntries(DEAL_TYPES.map(t=>[t,deals.filter(d=>d.result===t).length])),lost:L.filter(d=>d.result==="무산"&&inGoal(d.resultDate||d.meetDate)).length,
    upcoming:L.filter(d=>d.status==="예정").sort((a,b)=>(a.meetDate+a.meetTime).localeCompare(b.meetDate+b.meetTime)),
    pending:L.filter(d=>d.status!=="예정"&&(!d.result||d.result==="진행중")),
    dueLeft:Math.round((new Date(g.due)-TODAY)/864e5)};}
const dealChip=r=>r==="도급"?'<span class="chip ok">도급</span>':r==="채용대행"?'<span class="chip">채용대행</span>':r==="일용직"?'<span class="chip vis">일용직</span>':r==="무산"?'<span class="chip late">무산</span>':r==="진행중"?'<span class="chip mute">협의 중</span>':'<span class="chip mute">계약형태 미정</span>';
function dealRow(d){const past=d.status==="예정"&&d.meetDate<iso(TODAY);
  return `<div class="jrow"><div class="jn"><b>${esc(d.co)}</b> <span class="chip mute">${d.branch}</span> <span class="sub">${esc(d.mgr)}</span>
   <div class="sub">${mdShort(d.meetDate)}${d.meetTime?" "+d.meetTime:""} 미팅${d.status!=="예정"?` · TO ${d.to||0}명`:past?' · <span class="up">계약형태를 입력해 주세요</span>':""}${d.resultDate&&d.result&&d.result!=="진행중"?` · ${mdShort(d.resultDate)} ${d.result==="무산"?"무산":"성사"}`:""}${d.memo?` · ${esc(d.memo)}`:""}</div></div>
   <div class="jst">${d.status!=="예정"?dealChip(d.result):""}${d.status==="예정"?`<button class="btn sm primary" data-act="dlDone" data-id="${d.id}">미팅 완료</button>`:(!d.result||d.result==="진행중")?`<button class="btn sm primary" data-act="dlResult" data-id="${d.id}">계약형태 입력</button>`:""}<button class="btn sm" data-act="dlEdit" data-id="${d.id}" aria-label="수정">✎</button></div></div>`;}
function vSales(){const g=SG();const st=salesStat();const brs=salesVisBR();
  const f=S.ui.salesBr||"전체";const L=salesList().filter(d=>f==="전체"||d.branch===f);const fs=salesStat(L);
  const rate=g.deal?pct(fs.deal,g.deal):0;
  const byMgr={};L.forEach(d=>{const m=byMgr[d.mgr]=byMgr[d.mgr]||{meet:0,to:0,deal:0};if(d.status!=="예정"&&inGoal(d.meetDate)){m.meet++;m.to+=+d.to||0;}if(DEAL_TYPES.includes(d.result)&&inGoal(d.resultDate||d.meetDate))m.deal++;});
  return ph("영업성과",`미팅 일정 → 미팅 후 TO → 계약형태(도급·채용대행·일용직)까지 기록합니다. ${limited()?`${myBr()} 지사와 본사 자료가 보입니다.`:"본사는 전체 지사가 보입니다."}`,`<button class="btn primary" data-act="dlNew">+ 미팅 등록</button>`)+
  `<div class="banner">목표 기간 <b>${mdShort(g.from)} ~ ${mdShort(g.due)}</b> · ${st.dueLeft>=0?`기한까지 <b>D-${st.dueLeft}</b>`:`<span class="up">기한 ${-st.dueLeft}일 지남</span>`}${S.role==="ceo"?' · <button class="chip vis" style="border:0;cursor:pointer" data-act="tab" data-v="goal">목표·기한 바꾸기</button>':""}</div>
  <div class="subtabs">${["전체",...brs].map(x=>`<button data-act="salesBr" data-v="${x}" aria-pressed="${x===f}">${x}</button>`).join("")}</div>
  <div class="grid g4" style="margin-bottom:14px">
   <div class="card kpi">${ring(g.meet?pct(fs.meet,g.meet):0)}<div><span>미팅 완료</span><b>${fs.meet} / ${g.meet||"-"}회</b><span>예정 ${fs.meetPlan}회 더</span></div></div>
   <div class="card kpi">${ring(g.to?pct(fs.to,g.to):0)}<div><span>미팅으로 확보한 TO</span><b>${num(fs.to)} / ${g.to||"-"}명</b><span>성사된 TO ${num(fs.dealTo)}명</span></div></div>
   <div class="card kpi">${ring(rate)}<div><span>영업 성사</span><b>${fs.deal} / ${g.deal||"-"}건</b><span>${DEAL_TYPES.map(t=>`${t} ${fs.byType[t]}`).join(" · ")}${fs.lost?` · <span class="up">무산 ${fs.lost}</span>`:""}</span></div></div>
   <div class="card"><h3>담당자별</h3>${Object.entries(byMgr).sort((a,b)=>b[1].deal-a[1].deal||b[1].meet-a[1].meet).map(([m,v])=>`<div class="prow"><span>${esc(m)}</span>${bar(g.deal?pct(v.deal,Math.max(1,Math.round(g.deal/Math.max(1,Object.keys(byMgr).length)))):0," ")}<span class="v">미팅 ${v.meet} · TO ${v.to} · 성사 ${v.deal}</span></div>`).join("")||'<span class="sub">기록 없음</span>'}</div></div>
  <div class="grid g2">
   <div class="card"><h3>미팅 예정 <span class="sub">${fs.upcoming.length}건 · 타임트리에도 올라갑니다</span></h3>${fs.upcoming.map(dealRow).join("")||'<div class="empty">예정된 미팅이 없습니다.</div>'}</div>
   <div class="card"><h3>미팅 완료 · 계약형태 대기 <span class="sub">${fs.pending.length}건</span></h3>${fs.pending.sort((a,b)=>b.meetDate.localeCompare(a.meetDate)).map(dealRow).join("")||'<div class="empty">계약형태를 기다리는 건이 없습니다.</div>'}</div></div>
  <div class="card" style="margin-top:14px"><h3>계약 현황 <span class="sub">최근순</span></h3><div class="tw" style="border:0"><table class="x resp"><thead><tr><th>계약일</th><th>지사</th><th>업체</th><th>담당</th><th>미팅일</th><th>TO</th><th>계약형태</th><th></th></tr></thead><tbody>
   ${L.filter(d=>d.result&&d.result!=="진행중").sort((a,b)=>(b.resultDate||b.meetDate).localeCompare(a.resultDate||a.meetDate)).map(d=>`<tr><td>${mdShort(d.resultDate||d.meetDate)}</td><td>${d.branch}</td><td class="l"><b>${esc(d.co)}</b>${d.memo?`<div class="sub">${esc(d.memo)}</div>`:""}</td><td>${esc(d.mgr)}</td><td>${mdShort(d.meetDate)}</td><td class="num">${d.to||0}</td><td>${dealChip(d.result)}</td><td><button class="btn sm" data-act="dlEdit" data-id="${d.id}">✎</button></td></tr>`).join("")||'<tr><td colspan="8" class="sub">아직 계약형태가 정해진 건이 없습니다.</td></tr>'}</tbody></table></div></div>`;}
function dlSyncEvent(d){const t=`영업미팅 · ${d.co}`;let e=S.events.find(x=>x.dealId===d.id);
  if(d.status!=="예정"){if(e)e.title=`영업미팅 · ${d.co} (완료)`;return;}
  if(!e){e={id:uid(),dealId:d.id};S.events.push(e);}Object.assign(e,{date:d.meetDate,hour:d.meetTime?+d.meetTime.slice(0,2):null,staff:d.mgr,title:t});}
function dlForm(d){const n=!d;const brs=limited()?[myBr()]:salesVisBR();d=d||{co:"",branch:limited()?myBr():"본사",mgr:me(),meetDate:iso(addDays(TODAY,1)),meetTime:"",memo:"",status:"예정",to:0,result:"",resultDate:""};
  modal(n?"미팅 등록":"영업 건 수정",`<div class="row3">${F("업체",inp("co",d.co,"text","required"))}${F("지사",sel("branch",brs,d.branch))}${F("영업담당자",sel("mgr",PEOPLE(),d.mgr))}</div>
   <div class="row3">${F("미팅 날짜",inp("meetDate",d.meetDate,"date","required"))}${F("시간 (선택)",inp("meetTime",d.meetTime,"time"))}${F("메모",inp("memo",d.memo))}</div>
   ${n?"":`<div class="row3">${F("상태",sel("status",["예정","완료"],d.status))}${F("확보 TO",inp("to",d.to,"number"))}${F("계약형태",`<select name="result">${["","진행중",...DEAL_TYPES,"무산"].map(o=>`<option value="${o}" ${o===d.result?"selected":""}>${o===""?"(미정)":o==="진행중"?"협의 중":o}</option>`).join("")}</select>`)}</div>${F("계약일",inp("resultDate",d.resultDate,"date"))}`}`,
   {onSubmit:fd=>{const o=n?{id:uid(),status:"예정",to:0,result:"",resultDate:""}:S.sales.find(x=>x.id===d.id);
     Object.assign(o,{co:fd.get("co").trim(),branch:fd.get("branch"),mgr:fd.get("mgr"),meetDate:fd.get("meetDate"),meetTime:fd.get("meetTime")||"",memo:fd.get("memo")||""});
     if(!n){o.status=fd.get("status");o.to=+fd.get("to")||0;o.result=fd.get("result");o.resultDate=fd.get("resultDate")||(o.result&&o.result!=="진행중"?iso(TODAY):"");}
     if(n)S.sales.push(o);dlSyncEvent(o);if(o.mgr!==me())notify([o.mgr],`영업 미팅 담당 지정: ${mdShort(o.meetDate)} ${o.co}`,"sales");toast(n?"미팅을 등록했습니다 (타임트리에도 추가)":"저장했습니다");},
    extra:n?"":`<button type="button" class="btn danger" data-act="dlDel" data-id="${d.id}">삭제</button>`});}

/* ---------- 금주 입사예정자 ---------- */
const JST={"대기":["mute","결과 대기"],"완료":["ok","입사완료"],"보류":["vis","입사보류"],"연기":["","입사연기"],"포기":["late","입사포기"]};
function weekRange(off){const mon=addDays(TODAY,-((TODAY.getDay()+6)%7)+7*off);return [iso(mon),iso(addDays(mon,6)),mon];}
function parseBoard(text,mode){ // mode join|quit
  const out=[];let co="",date="";
  text.split(/\n/).forEach(raw=>{let l=raw.trim();if(!l)return;
    const c=l.match(/^[<〈《\[]\s*(.+?)\s*[>〉》\]]\s*(.*)$/);if(c){co=c[1];date="";l=c[2].trim();if(!l)return;}
    const dates=[...l.matchAll(/(\d{1,2})\s*[\/.]\s*(\d{1,2})/g)].map(m=>md(m[0]));
    if(mode==="join"){if(dates[0])date=dates[0];
      const rest=l.replace(/(\d{1,2})\s*[\/.]\s*(\d{1,2})/,"").trim();
      const name=(rest.match(/[가-힣]{2,4}/)||[""])[0];if(!name)return;
      const digits=(rest.match(/\d{3,4}/g)||[]);const phone=digits.length>=2?"010-"+digits[digits.length-2]+"-"+digits[digits.length-1]:(digits[0]||"");
      out.push({date,co,name,phone,ck:/[vV✓✔]/.test(rest.replace(/[가-힣]/g,""))});}
    else{const rest=l.replace(/(\d{1,2})\s*[\/.]\s*(\d{1,2})/g,"").replace(/입사|퇴사|→|~|-/g," ").trim();
      const name=(rest.match(/[가-힣○]{2,4}/)||[""])[0];if(!name)return;
      out.push({co,name,inDate:dates[0]||"",outDate:dates[1]||dates[0]||"",reason:rest.replace(name,"").trim()});}
  });return out;}
function joinRow(j){const [cls,lbl]=JST[j.status];
  return `<div class="jrow"><div class="jn"><b>${esc(j.name)}</b>${j.ck?'<span class="chip ok" title="사전 연락 확인">✓</span>':""} <span class="sub">${esc(j.phone)}</span>${j.hist.length?`<span class="chip mute">재투입 · 처음 ${mdShort(j.hist[0].date)}</span>`:""}${j.link&&(j.link.hc||j.link.to)?`<span class="chip ok" title="${esc([linkLabel(j.link.hc),linkLabel(j.link.to)].filter(Boolean).join(" / "))}">인원·TO +1 반영</span>`:""}${j.memo?`<div class="sub">${esc(j.memo)}</div>`:""}</div>
   <div class="jst"><span class="chip ${cls}">${lbl}</span><div class="seg" role="group" aria-label="${esc(j.name)} 입사 결과">${["완료","보류","연기","포기"].map(s=>`<button data-act="jSet" data-id="${j.id}" data-v="${s}" aria-pressed="${j.status===s}">${s==="완료"?"입사":s}</button>`).join("")}</div><button class="btn sm" data-act="jEdit" data-id="${j.id}" aria-label="수정">✎</button></div></div>`;}
function joinBlock(list){const byCo={};list.forEach(j=>{(byCo[j.co]=byCo[j.co]||[]).push(j);});
  return Object.entries(byCo).map(([co,js])=>`<div class="wb"><div class="wbh">&lt; ${esc(co)} &gt; <span class="sub">${esc(js[0].mgr||"")} · ${js.length}명</span></div>${js.map(joinRow).join("")}</div>`).join("");}
function vJoin(){
  const off=S.ui.joinWk;const [a,b]=weekRange(off),[c,d]=weekRange(off+1);const t=iso(TODAY);
  const need=S.joins.filter(j=>j.date&&j.date<t&&j.status==="대기");
  const nodate=S.joins.filter(j=>!j.date&&j.status!=="완료"&&j.status!=="포기");
  const inR=(j,x,y)=>j.date>=x&&j.date<=y;const wk=S.joins.filter(j=>inR(j,a,b));
  const res=wk.filter(j=>j.status!=="대기");const ok=wk.filter(j=>j.status==="완료").length;
  const days=(x,y)=>{let h="";for(let i=0;i<7;i++){const k=iso(addDays(new Date(x),i));const js=S.joins.filter(j=>j.date===k);if(!js.length)continue;const dd=new Date(k);
    h+=`<div class="jday ${k===t?"today":""}"><h4>${dd.getMonth()+1}/${dd.getDate()} (${DOW[dd.getDay()]}) ${k===t?'<span class="chip vis">오늘</span>':""}<span class="sub">${js.length}명 입사 예정</span></h4>${joinBlock(js)}</div>`;}return h||'<div class="empty">입사 예정자가 없습니다.</div>';};
  return ph("금주 입사예정자","‘입사예정자 정보등록’에 업체·날짜·이름·연락처를 적어 넣으면 정리됩니다. 입사일 다음 날 결과를 눌러 주세요. '입사'를 누르면 인원현황 합계와 TO 실제 투입이 1씩 올라가고, 결과를 바꾸면 자동으로 되돌아갑니다.",
   `<button class="btn primary" data-act="jPaste">✎ 입사예정자 정보등록</button><button class="btn" data-act="jEdit">+ 1명 추가</button>`)+
  `<div class="grid g4" style="margin-bottom:14px">
   <div class="card kpi">${ring(pct(ok,res.length||0))}<div><span>이번 주 입사율</span><b>${ok} / ${res.length}명</b><span>결과가 나온 인원 기준</span></div></div>
   <div class="card"><span class="sub">이번 주 예정</span><div class="big">${wk.length}명</div><span class="sub">다음 주 ${S.joins.filter(j=>inR(j,c,d)).length}명</span></div>
   <div class="card"><span class="sub">보류 · 연기</span><div class="big">${wk.filter(j=>j.status==="보류").length} · ${S.joins.filter(j=>j.hist.length&&j.date>=t).length}</div><span class="sub">연기는 재투입 예정 인원</span></div>
   <div class="card"><span class="sub">포기</span><div class="big inv-x">${wk.filter(j=>j.status==="포기").length}명</div></div></div>
  ${need.length?`<div class="card" style="margin-bottom:14px;border-color:var(--late)"><h3><span>⚠ 결과 확인 필요 <span class="sub">입사일이 지났는데 결과가 없는 인원 ${need.length}명</span></span></h3>${joinBlock(need)}</div>`:""}
  ${nodate.length?`<div class="card" style="margin-bottom:14px"><h3>날짜 미정 <span class="sub">${nodate.length}명 · ✎에서 입사일을 넣어 주세요</span></h3>${joinBlock(nodate)}</div>`:""}
  <div class="tools" style="margin:6px 0 10px"><button class="btn sm" data-act="jWk" data-v="-1" aria-label="이전 주">◀</button><button class="btn sm" data-act="jWk" data-v="0">이번 주</button><button class="btn sm" data-act="jWk" data-v="1" aria-label="다음 주">▶</button></div>
  <div class="grid g2"><div><h3 class="wkh">${off===0?"이번 주":"선택한 주"} <span class="sub">${mdShort(a)} ~ ${mdShort(b)}</span></h3>${days(a,b)}</div><div><h3 class="wkh">그다음 주 <span class="sub">${mdShort(c)} ~ ${mdShort(d)}</span></h3>${days(c,d)}</div></div>`;
}
function jPasteForm(mode){
  const q=mode==="quit";
  modal(q?"퇴사자 적어 넣기":"입사예정자 정보등록",`<p class="sub" style="margin-top:0">${q?"업체를 &lt; &gt;로 묶고, 한 줄에 '입사일 이름 퇴사일 사유' 순서로 적어 주세요.":"업체를 &lt; &gt;로 묶고, 한 줄에 '날짜 이름 연락처' 순서로 적어 주세요. 날짜는 첫 사람에게만 써도 아래 사람에게 이어집니다. ✓(V)는 사전 연락 확인 표시."}</p>
   <label class="field"><span>내용</span><textarea name="t" id="pasteT" style="min-height:170px;font-family:var(--font)" placeholder="${q?"<코스원>\n9/29 김민수 10/2 업무 강도\n9/22 이영희 10/6":"<코스원>\n10/8 이국화 3218 8515\n최현지 3097 2545 V\n\n<하이뷰티>\n10/12 이도림 8156 7058"}"></textarea></label><div id="pasteP" class="sub">미리보기가 여기에 나옵니다.</div>`,
   {wide:true,submit:"추가",onSubmit:fd=>{const rs=parseBoard(fd.get("t"),q?"quit":"join");
     if(q)rs.forEach(r=>{const c=hcCands(r.co)[0];const link=c&&c.sc>0?{hc:c.path}:null;if(link)bumpPath(link.hc,-1);S.quits.push({id:uid(),...r,co:r.co||"업체 미정",branch:"본사",mgr:mgrOfCo(r.co),link});});
     else rs.forEach(r=>S.joins.push({id:uid(),...r,co:r.co||"업체 미정",mgr:mgrOfCo(r.co),status:"대기",memo:"",hist:[]}));toast(`${rs.length}명 추가했습니다`);}});
  const ta=document.getElementById("pasteT");ta.dataset.mode=q?"quit":"join";
}
function pastePreview(ta){const rs=parseBoard(ta.value,ta.dataset.mode);const p=document.getElementById("pasteP");if(!p)return;
  p.innerHTML=rs.length?`<div class="tw"><table class="x"><thead><tr><th>업체</th>${ta.dataset.mode==="quit"?"<th>이름</th><th>입사일</th><th>퇴사일</th><th>사유</th>":"<th>입사일</th><th>이름</th><th>연락처</th><th>✓</th>"}</tr></thead><tbody>${rs.map(r=>ta.dataset.mode==="quit"?`<tr><td>${esc(r.co)}</td><td>${esc(r.name)}</td><td>${mdShort(r.inDate)}</td><td>${mdShort(r.outDate)}</td><td class="l">${esc(r.reason)}</td></tr>`:`<tr><td>${esc(r.co)}</td><td>${r.date?mdShort(r.date):'<span class="up">미정</span>'}</td><td>${esc(r.name)}</td><td>${esc(r.phone)}</td><td>${r.ck?"✓":""}</td></tr>`).join("")}</tbody></table></div><p class="sub">${rs.length}명이 추가됩니다.</p>`:"미리보기가 여기에 나옵니다.";}

    extra:n?"":`<button type="button" class="btn danger" data-act="jDel" data-id="${j.id}">삭제</button>`});}
function jPostpone(j){modal(`${esc(j.name)} 입사연기`,`${F("재투입 예정일",inp("date",iso(addDays(TODAY,3)),"date","required"))}${F("사유 (선택)",inp("why"))}<p class="sub">재투입 날짜로 옮겨지고 '재투입' 표시가 붙습니다. 원래 날짜는 기록으로 남습니다.</p>`,
  {submit:"연기 저장",onSubmit:fd=>{j.hist.push({date:j.date,status:"연기",why:fd.get("why")});j.date=fd.get("date");j.status="대기";if(fd.get("why"))j.memo="연기 사유: "+fd.get("why");toast(`${mdShort(j.date)} 재투입으로 옮겼습니다`);}});}

/* ---------- 입사·퇴사 → 인원현황·TO 자동 반영 ---------- */
function findHcRow(id){for(const t of HC_TABS)for(const g of (S.hc[t]||[]))for(const r of g.rows)if(r.id===id)return [g,r];return [null,null];}
function findToRow(id){for(const b of Object.keys(S.to))for(const r of S.to[b])if(r.id===id)return [b,r];return [null,null];}
function getPath(p){if(!p)return null;if(p.startsWith("hcid:"))return findHcRow(p.slice(5))[1];if(p.startsWith("toid:"))return findToRow(p.slice(5))[1];return p.split(".").reduce((o,k)=>o==null?o:o[k],S);}
function bumpPath(p,d){if(p.startsWith("hcid:")){const r=findHcRow(p.slice(5))[1];if(r)r.cur=Math.max(0,(+r.cur||0)+d);return;}const ks=p.split(".");const k=ks.pop();const o=ks.reduce((x,y)=>x[y],S);o[k]=Math.max(0,(+o[k]||0)+d);}
function coScore(a,b){const x=norm(a),y=norm(b);if(!x||!y)return 0;if(x===y)return 3;if(x.includes(y)||y.includes(x))return 2;return 0;}
function hcCands(co){const out=[];HC_TABS.forEach(t=>(S.hc[t]||[]).forEach((g,gi)=>{if(!visG(g))return;g.rows.forEach((r,i)=>{const sc=coScore(co,r.co)-(r.excluded?1.5:0);
  out.push({path:`hcid:${r.id}`,label:`${g.name} · ${r.co} (현재 ${r.cur}명)${r.excluded?" · 합계 제외 줄":""}`,sc});});}));
  return out.sort((a,b)=>b.sc-a.sc);}
function toCands(co){const out=[];visBR().forEach(b=>(S.to[b]||[]).forEach((r,i)=>{out.push({path:`toid:${r.id}`,label:`${b} · ${r.co}${r.job?" / "+r.job:""} (TO ${r.to??"상시"} · 투입 ${r.placed})`,sc:coScore(co,r.co)});}));return out.sort((a,b)=>b.sc-a.sc);}
function candSel(name,list,emptyLbl){const best=list[0]&&list[0].sc>0?list[0].path:"";const hit=list.filter(c=>c.sc>0),rest=list.filter(c=>c.sc<=0);
  return `<select name="${name}"><option value="">${emptyLbl}</option>${hit.length?`<optgroup label="이름이 비슷한 업체">${hit.map(c=>`<option value="${c.path}" ${c.path===best?"selected":""}>${esc(c.label)}</option>`).join("")}</optgroup>`:""}<optgroup label="다른 업체에서 고르기">${rest.map(c=>`<option value="${c.path}">${esc(c.label)}</option>`).join("")}</optgroup></select>`;}
function linkLabel(p){if(!p)return "";if(p.startsWith("hcid:")){const [g,r]=findHcRow(p.slice(5));return r?`${g.name} · ${r.co}`:"";}if(p.startsWith("toid:")){const [b,r]=findToRow(p.slice(5));return r?`${b} TO · ${r.co}${r.job?" / "+r.job:""}`:"";}const ks=p.split(".");if(ks[0]==="hc"){const g=S.hc[ks[1]][+ks[2]],r=g&&g.rows[+ks[4]];return r?`${g.name} · ${r.co}`:"";}const r=S.to[ks[1]][+ks[2]];return r?`${ks[1]} TO · ${r.co}${r.job?" / "+r.job:""}`:"";}
function jDone(j){const hc=hcCands(j.co),to=toCands(j.co);
  modal(`${esc(j.name)} 입사 처리`,`<p class="sub" style="margin-top:0">${esc(j.co)} 입사로 표시하면서 아래 두 곳의 숫자를 1씩 올립니다. 업체가 다르면 직접 골라 주세요.</p>
   ${F("인원현황 · 합계인원 +1",candSel("hc",hc,"인원현황에는 반영 안 함"))}${F("TO 현황 · 실제 투입 +1 (투입 예정이 있으면 −1)",candSel("to",to,"TO에는 반영 안 함"))}
   ${!(hc[0]&&hc[0].sc>0)?`<p class="banner">인원현황에서 '${esc(j.co)}'와 비슷한 업체를 찾지 못했습니다. 목록에서 고르거나 '반영 안 함'으로 두세요.</p>`:""}`,
   {submit:"입사 처리",onSubmit:fd=>{const L={hc:fd.get("hc")||"",to:fd.get("to")||"",planDec:false};
     if(L.hc)bumpPath(L.hc,1);
     if(L.to){const r=getPath(L.to);r.placed=(+r.placed||0)+1;if(+r.plan>0){r.plan--;L.planDec=true;}}
     j.status="완료";j.link=L;toast(`${j.name} 입사 — ${[L.hc&&"인원현황",L.to&&"TO"].filter(Boolean).join("·")||"숫자 반영 없이"} 처리`);}});}
function unlinkJoin(j){const L=j.link;if(!L)return false;
  if(L.hc&&getPath(L.hc)!=null)bumpPath(L.hc,-1);
  if(L.to){const r=getPath(L.to);if(r){r.placed=Math.max(0,(+r.placed||0)-1);if(L.planDec)r.plan=(+r.plan||0)+1;}}
  j.link=null;return true;}
function unlinkQuit(q){if(q.link&&q.link.hc&&getPath(q.link.hc)!=null){bumpPath(q.link.hc,1);q.link=null;return true;}return false;}

/* ---------- 퇴사자 공유 ---------- */
const daysWorked=q=>q.inDate&&q.outDate?Math.round((new Date(q.outDate)-new Date(q.inDate))/864e5)+1:null;
function vQuit(){
  const m=S.ui.quitYm;const [y,mo]=m.split("-").map(Number);
  const list=S.quits.filter(q=>(q.outDate||"").startsWith(m)).sort((a,b)=>b.outDate.localeCompare(a.outDate));
  const early=list.filter(q=>(daysWorked(q)??99)<=7).length;const dw=list.map(daysWorked).filter(x=>x!=null);
  const byCo={};list.forEach(q=>(byCo[q.co]=byCo[q.co]||[]).push(q));const cos=Object.entries(byCo).sort((a,b)=>b[1].length-a[1].length);const mx=cos.length?cos[0][1].length:1;
  return ph("퇴사자 공유","업체별 퇴사자를 '며칠 입사 누구 → 며칠 퇴사'로 공유합니다. 근무일수는 자동 계산됩니다.",

      {onSubmit:fd=>{Object.assign(it,{co:fd.get("co").trim(),branch:fd.get("branch"),kind:fd.get("kind"),due:+fd.get("due")||null});toast("저장했습니다");},extra:`<button type="button" class="btn danger" data-act="invDel" data-i="${i}">거래처 삭제</button>`});},
    invDel:()=>{if(confirm("이 거래처를 목록에서 지울까요?")){S.inv.splice(+el.dataset.i,1);closeModal();}},
    invSet:()=>{const it=S.inv[+el.dataset.i];it.status=it.status||{};const m=S.ui.invYm;const s=it.status[m]=invOX(it,m);const k=el.dataset.k;s[k]=s[k]===v?"":v;},
    docNew:()=>docNewForm(),docF:()=>S.ui.docF=v,docDone:()=>docDoneForm(S.docreqs.find(d=>d.id===el.dataset.id)),
    docUndo:()=>{const d=S.docreqs.find(x=>x.id===el.dataset.id);d.status="대기";delete d.doneBy;delete d.doneAt;},
    docDel:()=>{if(confirm("이 요청을 취소할까요?"))S.docreqs=S.docreqs.filter(x=>x.id!==el.dataset.id);},
    docFileDel:()=>{const d=S.docreqs.find(x=>x.id===el.dataset.id);const f=d.files.splice(+el.dataset.i,1)[0];if(f&&f.path)sb.storage.from("hub-files").remove([f.path]);},
    payNew:()=>payNewForm(),payF:()=>S.ui.payF=v,payEdit:()=>payEditForm(S.pays.find(p=>p.id===el.dataset.id)),
    payDel:()=>{S.pays=S.pays.filter(p=>p.id!==el.dataset.id);closeModal();},
    payDone:()=>{const p=S.pays.find(x=>x.id===el.dataset.id);p.status="지급완료";p.paidBy=me();p.paidAt=iso(TODAY);notify([p.by],`${p.type} 지급완료: ${p.co} ${p.name}${p.amt?" "+won(p.amt)+"원":""}`,"pay");toast(`${p.name} 지급완료`);},
    payUndo:()=>{const p=S.pays.find(x=>x.id===el.dataset.id);p.status="대기";delete p.paidBy;delete p.paidAt;},
    payBatch:()=>{let n=0;S.pays.filter(p=>p.batch===v&&p.status!=="지급완료").forEach(p=>{p.status="지급완료";p.paidBy=me();p.paidAt=iso(TODAY);n++;});const ps=S.pays.filter(p=>p.batch===v);if(ps[0])notify([ps[0].by],`주급·가불 ${n}명 지급완료 (${ps.map(p=>p.name).slice(0,3).join(", ")}${ps.length>3?" 외":""})`,"pay");toast(`${n}명 지급완료`);},
    invDo:()=>{const it=S.inv[+el.dataset.i];it.status=it.status||{};const m=S.ui.invYm;it.status[m]={issued:m===ym(TODAY)?iso(TODAY):m+"-"+pad(it.due)};toast("발행 완료로 표시했습니다");},
    invUndo:()=>{delete S.inv[+el.dataset.i].status[S.ui.invYm];},
    invNew:()=>modal("계산서 거래처 추가",`<div class="row2">${F("거래처",inp("co","","text","required"))}${F("지사",sel("branch",BRANCHES,"본사"))}</div><div class="row2">${F("발행 서류",sel("kind",["계산서","명세표","계산서+명세표"],"계산서"))}${F("매월 발행일",inp("due",10,"number",'min="1" max="31"'))}</div>`,
      {onSubmit:fd=>{S.inv.push({id:uid(),co:fd.get("co"),branch:fd.get("branch"),kind:fd.get("kind"),due:+fd.get("due")||10,status:{}});}}),
  };
  const CHG={docUndo:"서류 전달 되돌리기",docDel:"서류 요청 취소",docFileDel:"서류 파일 빼기",hcAdd:"인원현황 줄 추가",hcDel:"인원현황 줄 삭제",hcBase:"기준 인원 저장",toAdd:"TO 줄 추가",toDel:"TO 줄 삭제",jSet:"입사예정자 결과 처리",jDel:"입사예정자 삭제",qDel:"퇴사자 삭제",postRead:"특이사항 확인",postDel:"특이사항 삭제",evDel:"일정 삭제",lvOk:"연차 승인",lvNo:"연차 반려",invSet:"계산서·명세표 O/X 표시",payDone:"주급·가불 지급완료",payUndo:"지급완료 취소",payBatch:"주급·가불 지급완료",payDel:"주급·가불 신청 삭제",arMemoAdd:"미수금 메모",arMemoPaid:"미수금 입금 확인",arMemoMiss:"미수금 미입금 표시",arMemoUndo:"미수금 되돌리기",arDel:"미수금 삭제",dlDel:"영업 건 삭제",adNewWk:"광고표 새 주 시작",adAddCo:"광고표 업체 추가"};
  if(H[a]){if(CHG[a]&&S.role!=="ceo"){const t=S.tab;queueMicrotask(()=>{notifyCeoChange(CHG[a],t);save();renderHead();});}const opensModal=["pw","accounts","logout","budgetEdit","pushOn","docNew","docDone","invEdit","notif","payNew","payEdit","adPB","dlNew","dlEdit","dlDone","dlResult","arMemoFor","adUp","adCell","adAlias","jPaste","qPaste","jEdit","qNew","qEdit","calDay","evNew","evEdit","condEdit","postNew","arNew","arEdit","lvNew","invNew"].includes(a);H[a]();save();
    if(!opensModal&&a!=="close"&&!document.querySelector(".overlay")){const y=scrollY;render();if(a!=="tab")scrollTo(0,y);}
    void keepModal;}
});
boot();
</script>
